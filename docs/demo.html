<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAD Viewer Demo - Nextcloud App</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.8.8/dist/index.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #1a1a1a;
      color: #fff;
      min-height: 100vh;
    }
    .header {
      background: #2d2d2d;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #3d3d3d;
    }
    .header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .header a {
      color: #0082c9;
      text-decoration: none;
    }
    .header a:hover {
      text-decoration: underline;
    }
    .info {
      background: #252525;
      padding: 1rem 2rem;
      border-bottom: 1px solid #3d3d3d;
      font-size: 0.875rem;
      color: #ccc;
    }
    .info a {
      color: #0082c9;
    }
    #app {
      width: 100%;
      height: calc(100vh - 100px);
    }
    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #3d3d3d;
      border-top-color: #0082c9;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .demo-note {
      background: #1a3a5c;
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
      color: #8ac6ff;
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>
      <span>🎨</span>
      CAD Viewer - Nextcloud App Demo
    </h1>
    <div style="display: flex; gap: 1rem; align-items: center;">
      <a href="https://apps.nextcloud.com/apps/cad_viewer" target="_blank">Nextcloud App Store</a>
      <a href="https://github.com/ashcoft/nextcloud-cad-viewer" target="_blank">GitHub</a>
    </div>
  </header>
  
  <div class="demo-note">
    Demo mode: Loading sample CAD data. For full Nextcloud integration, install the app on your Nextcloud instance.
  </div>
  
  <div id="app">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Loading CAD Viewer...</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.8.8/dist/index.full.min.js"></script>
  
  <script type="module">
    // Wait for DOM and libraries
    document.addEventListener('DOMContentLoaded', async () => {
      const app = document.getElementById('app');
      const loading = document.getElementById('loading');
      
      try {
        // Create Vue app with CAD viewer placeholder
        const { createApp, ref, onMounted } = Vue;
        
        const CadViewerDemo = {
          template: `
            <div class="cad-viewer-demo" style="width: 100%; height: 100%; background: #1e1e1e; display: flex; flex-direction: column;">
              <!-- Toolbar -->
              <div class="toolbar" style="background: #2d2d2d; padding: 0.5rem 1rem; display: flex; gap: 0.5rem; border-bottom: 1px solid #3d3d3d;">
                <el-button size="small" @click="zoomIn" title="Zoom In">➕ Zoom In</el-button>
                <el-button size="small" @click="zoomOut" title="Zoom Out">➖ Zoom Out</el-button>
                <el-button size="small" @click="resetView" title="Reset View">🔄 Reset</el-button>
                <el-button size="small" @click="toggleTheme" title="Toggle Theme">{{ theme === 'dark' ? '☀️ Light' : '🌙 Dark' }}</el-button>
                <div style="flex: 1;"></div>
                <el-button size="small" type="primary" @click="openFile">📂 Open File</el-button>
              </div>
              
              <!-- Canvas -->
              <div ref="canvas" class="canvas" style="flex: 1; position: relative; overflow: hidden;">
                <!-- Simulated CAD drawing -->
                <svg :style="{ width: '100%', height: '100%', background: theme === 'dark' ? '#1e1e1e' : '#ffffff' }" viewBox="0 0 800 600">
                  <!-- Grid -->
                  <defs>
                    <pattern id="grid" :width="gridSize" :height="gridSize" patternUnits="userSpaceOnUse">
                      <path :d="'M ' + gridSize + ' 0 L 0 0 0 ' + gridSize" fill="none" :stroke="theme === 'dark' ? '#333' : '#ddd'" stroke-width="0.5"/>
                    </pattern>
                  </defs>
                  <rect width="100%" height="100%" fill="url(#grid)"/>
                  
                  <!-- Sample House Drawing -->
                  <g :transform="'translate(' + panX + ',' + panY + ') scale(' + zoom + ')'">
                    <!-- Floor -->
                    <rect x="100" y="200" width="300" height="200" fill="none" :stroke="theme === 'dark' ? '#4a9eff' : '#0066cc'" stroke-width="2"/>
                    
                    <!-- Roof -->
                    <polygon :points="'100,200 250,80 400,200'" fill="none" :stroke="theme === 'dark' ? '#ff6b6b' : '#cc0000'" stroke-width="2"/>
                    
                    <!-- Door -->
                    <rect x="180" y="280" width="50" height="80" fill="none" :stroke="theme === 'dark' ? '#ffd93d' : '#cc9900'" stroke-width="2"/>
                    
                    <!-- Windows -->
                    <rect x="280" y="250" width="60" height="50" fill="none" :stroke="theme === 'dark' ? '#6bcb77' : '#009900'" stroke-width="2"/>
                    <rect x="280" y="320" width="60" height="50" fill="none" :stroke="theme === 'dark' ? '#6bcb77' : '#009900'" stroke-width="2"/>
                    
                    <!-- Dimensions -->
                    <text x="250" y="420" :fill="theme === 'dark' ? '#888' : '#666'" font-size="12" text-anchor="middle">300mm</text>
                    <text x="450" y="300" :fill="theme === 'dark' ? '#888' : '#666'" font-size="12" text-anchor="middle" :transform="'rotate(90, 450, 300)'">200mm</text>
                  </g>
                  
                  <!-- Info Overlay -->
                  <text x="10" y="20" fill="#888" font-size="11">Sample Floor Plan - DXF/DWG Preview</text>
                  <text x="10" y="35" fill="#666" font-size="10">Zoom: {{ Math.round(zoom * 100) }}% | Pan: {{ panX }}, {{ panY }}</text>
                </svg>
                
                <!-- Layer Panel -->
                <div class="layers" style="position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); padding: 0.5rem; border-radius: 4px; font-size: 0.75rem;">
                  <div style="color: #888; margin-bottom: 0.25rem;">LAYERS</div>
                  <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" checked @change="toggleLayer('walls')">
                    <span style="color: #4a9eff;">■</span> Walls
                  </div>
                  <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" checked @change="toggleLayer('roof')">
                    <span style="color: #ff6b6b;">■</span> Roof
                  </div>
                  <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" checked @change="toggleLayer('doors')">
                    <span style="color: #ffd93d;">■</span> Doors
                  </div>
                  <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" checked @change="toggleLayer('windows')">
                    <span style="color: #6bcb77;">■</span> Windows
                  </div>
                </div>
              </div>
              
              <!-- Status Bar -->
              <div class="status" style="background: #252525; padding: 0.25rem 1rem; font-size: 0.75rem; color: #888; display: flex; justify-content: space-between;">
                <span>Model Space | 1:1 | mm</span>
                <span>CAD Viewer Demo v1.0</span>
              </div>
              
              <!-- File Dialog -->
              <el-dialog v-model="showFileDialog" title="Open CAD File" width="400px">
                <p style="color: #666; margin-bottom: 1rem;">
                  In the full Nextcloud app, you can open DWG/DXF files directly from your Nextcloud storage.
                </p>
                <el-button type="primary" @click="showFileDialog = false">Open Nextcloud App</el-button>
              </el-dialog>
            </div>
          `,
          setup() {
            const zoom = ref(1);
            const panX = ref(0);
            const panY = ref(0);
            const gridSize = ref(50);
            const theme = ref('dark');
            const showFileDialog = ref(false);
            
            const zoomIn = () => zoom.value = Math.min(zoom.value * 1.2, 5);
            const zoomOut = () => zoom.value = Math.max(zoom.value / 1.2, 0.1);
            const resetView = () => { zoom.value = 1; panX.value = 0; panY.value = 0; };
            const toggleTheme = () => theme.value = theme.value === 'dark' ? 'light' : 'dark';
            const toggleLayer = (layer) => console.log('Toggle layer:', layer);
            const openFile = () => showFileDialog.value = true;
            
            return { zoom, panX, panY, gridSize, theme, showFileDialog, zoomIn, zoomOut, resetView, toggleTheme, toggleLayer, openFile };
          }
        };
        
        const vueApp = createApp(CadViewerDemo);
        vueApp.use(ElementPlus);
        vueApp.mount('#app');
        
      } catch (error) {
        app.innerHTML = `
          <div style="color: red; padding: 2rem;">
            <h2>Error loading CAD Viewer</h2>
            <p>${error.message}</p>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
