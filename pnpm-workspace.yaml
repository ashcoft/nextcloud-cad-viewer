# pnpm v11 configuration
# In pnpm v11, settings like overrides and onlyBuiltDependencies must be in pnpm-workspace.yaml
# (the "pnpm" field in package.json is no longer read)
packages:
  - '.'

# Dependencies that require building from source
onlyBuiltDependencies:
  - unrs-resolver

# Version overrides for Nextcloud 33+ compatibility with mlightcad packages
overrides:
  '@mlightcad/data-model': '1.9.12'
  '@mlightcad/libredwg-converter': '3.5.38'
  '@mlightcad/mtext-input-box': '0.2.11'
  '@mlightcad/mtext-renderer': '0.10.14'
  '@mlightcad/ribbon': '0.1.9'
  'element-plus': '2.14.2'
  'three': '0.184.0'
  'vue': '3.5.38'
  'vue-i18n': '11.4.6'
