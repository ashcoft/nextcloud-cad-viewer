# pnpm workspace configuration
packages:
  - '.'

# Allow build scripts for native dependencies (unrs-resolver)
# pnpm v11 defaults strictDepBuilds=true which blocks all postinstall scripts
# until explicitly approved per-package
onlyBuiltDependencies:
  - unrs-resolver

# Disable supply-chain policy check for CI
# The lockfile is already validated via hash verification; additional age-based checks
# cause false positives on recently published transitive dependencies
minimumReleaseAge: 0

# Version overrides for Nextcloud 33+ compatibility with mlightcad packages
overrides:
  '@mlightcad/data-model': '1.9.12'
  '@mlightcad/libredwg-converter': '3.5.38'
  '@mlightcad/mtext-input-box': '0.2.11'
  '@mlightcad/mtext-renderer': '0.10.14'
  '@mlightcad/ribbon': '0.1.9'
  'element-plus': '2.14.2'
  'js-yaml': '^5.0.0'
  'three': '0.184.0'
  'vue': '3.5.38'
  'vue-i18n': '11.4.6'
