changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: 🚀 New Features
      labels:
        - enhancement
        - feature
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
    - title: 📝 Documentation
      labels:
        - documentation
    - title: 🔒 Security
      labels:
        - security
    - title: ⚡ Performance
      labels:
        - performance
    - title: ♻️ Refactoring
      labels:
        - refactoring
    - title: 🧪 Tests
      labels:
        - tests
    - title: 🔧 Maintenance
      labels:
        - maintenance
        - chore
    - title: Other Changes
      labels:
        - "*"
