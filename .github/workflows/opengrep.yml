name: OpenGrep Full Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC

jobs:
  opengrep:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Run OpenGrep Full Scan
      uses: opengrep/opengrep-action@v1
      with:
        args: --format github
      continue-on-error: true
