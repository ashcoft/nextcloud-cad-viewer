name: Static analysis

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on: pull_request

concurrency:
  group: psalm-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      src: ${{ steps.changes.outputs.src }}
    steps:
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: changes
        continue-on-error: true
        with:
          filters: |
            src:
              - '.github/workflows/**'
              - 'appinfo/**'
              - 'lib/**'
              - 'templates/**'
              - 'tests/**'
              - 'vendor/**'
              - 'vendor-bin/**'
              - '.php-cs-fixer.dist.php'
              - 'composer.json'
              - 'composer.lock'
              - 'package.json'
              - 'pnpm-lock.yaml'

  matrix:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.src != 'false'
    outputs:
      ocp-matrix: ${{ steps.versions.outputs.ocp-matrix }}
      php-min: ${{ steps.versions.outputs.php-min }}
    steps:
      - name: Checkout app
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Get version matrix
        id: versions
        uses: icewind1991/nextcloud-version-matrix@8a7bac6300b2f0f3100088b297995a229558ddba # v1.3.2

      - name: Check enforcement of minimum PHP version 8.4 in psalm.xml
        run: grep 'phpVersion="8.4"' psalm.xml

  static-analysis:
    runs-on: ubuntu-latest
    needs: [changes, matrix]
    if: needs.changes.outputs.src != 'false'
    strategy:
      # do not stop on another job's failure
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.ocp-matrix) }}

    name: static-psalm-analysis ${{ matrix.ocp-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up php${{ needs.matrix.outputs.php-min }}
        uses: shivammathur/setup-php@v2 # 2.37.2
        with:
          php-version: '8.4'
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
          coverage: none
          ini-file: development
          # Temporary workaround for missing pcntl_* in PHP 8.3
          ini-values: disable_functions=
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer i --ignore-platform-reqs && composer dump-autoload --ignore-platform-reqs

      - name: Install nextcloud/ocp # zizmor: ignore[template-injection]
        run: composer bin nextcloud-ocp require --dev 'nextcloud/ocp:${{ matrix.ocp-version }}' --ignore-platform-reqs --with-dependencies

      - name: Run coding standards check
        env:
          COMPOSER_IGNORE_PLATFORM_REQS: "1"
        run: composer run psalm -- --threads=1 --monochrome --no-progress --output-format=github

  summary:
    runs-on: ubuntu-latest
    needs: static-analysis

    if: always()

    name: static-psalm-analysis-summary

    steps:
      - name: Summary status
        run: |
          result="${{ needs.static-analysis.result }}"
          # Success or cancelled (superseded by newer run) are acceptable
          if [ "$result" != "success" ] && [ "$result" != "cancelled" ]; then
            echo "Static analysis failed with result: $result"
            exit 1
          fi
          echo "Static analysis completed with result: $result"
