name: Auto Changeset for Dependabot

on:
  pull_request:
    types:
      - closed

jobs:
  create-changeset:
    name: Create Changeset
    runs-on: ubuntu-latest
    # Only run when a Dependabot PR is merged
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install changeset CLI
        run: pnpm add -D @changesets/cli

      - name: Get PR info
        id: pr_info
        run: |
          echo "title=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
          echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

      - name: Determine bump type
        id: bump_type
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          
          # Determine bump type based on PR title
          if echo "$TITLE" | grep -qi "major\|breaking"; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif echo "$TITLE" | grep -qi "minor\|feat\|feature"; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Create Changeset
        id: create_changeset
        run: |
          BUMP_TYPE=${{ steps.bump_type.outputs.type }}
          PR_NUMBER=${{ github.event.pull_request.number }}
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          FILENAME=".changeset/dependabot-${PR_NUMBER}-${TIMESTAMP}.md"
          
          # Get package name from package.json
          PACKAGE_NAME=$(grep '"name"' package.json | head -1 | sed 's/.*"name": *"\([^"]*\)".*/\1/')
          
          cat > "$FILENAME" << 'EOF'
---
"${PACKAGE_NAME}": ${BUMP_TYPE}
---

Automated dependency update via Dependabot
EOF
          
          # Use env var expansion properly
          sed -i "s/\${PACKAGE_NAME}/$PACKAGE_NAME/g" "$FILENAME"
          sed -i "s/\${BUMP_TYPE}/$BUMP_TYPE/g" "$FILENAME"
          
          echo "file=$FILENAME" >> $GITHUB_OUTPUT
          echo "Created changeset file: $FILENAME"
          echo "Bump type: $BUMP_TYPE"
          echo "Package: $PACKAGE_NAME"

      - name: Commit changeset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .changeset/
          git commit -m "chore: add changeset for Dependabot #${{ github.event.pull_request.number }}"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}