name: Auto Changeset for Dependabot

on:
  pull_request:
    types:
      - closed

jobs:
  create-changeset:
    name: Create Changeset
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Get PR info
        id: pr_info
        run: |
          echo "title=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
          echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

      - name: Determine bump type
        id: bump_type
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          
          if echo "$TITLE" | grep -qi "major\|breaking"; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif echo "$TITLE" | grep -qi "minor\|feat\|feature"; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Create Changeset
        id: create_changeset
        run: |
          BUMP_TYPE=${{ steps.bump_type.outputs.type }}
          PR_NUMBER=${{ github.event.pull_request.number }}
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          FILENAME=".changeset/dependabot-${PR_NUMBER}-${TIMESTAMP}.md"
          
          # Get package name from package.json
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          
          cat > "$FILENAME" << EOF
---
"$PACKAGE_NAME": $BUMP_TYPE
---

Automated dependency update via Dependabot PR #$PR_NUMBER
EOF
          
          echo "file=$FILENAME" >> $GITHUB_OUTPUT
          echo "Created changeset file: $FILENAME"
          echo "Bump type: $BUMP_TYPE"
          echo "Package: $PACKAGE_NAME"

      - name: Commit and push changeset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .changeset/
          git commit -m "chore: add changeset for Dependabot #${{ github.event.pull_request.number }}"
          git push origin main