name: Build Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for build (optional, e.g., 0.0.9)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'webpack.config.js'
      - 'tsconfig.json'
      - 'babel.config.js'
      - 'Makefile'
      - 'composer.json'
      - 'composer.lock'
      - 'lib/**'
      - 'css/**'
      - 'templates/**'
      - 'appinfo/**'
      - 'img/**'

permissions:
  contents: read

concurrency:
  group: build-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  APP_NAME: cad_viewer
  APP_ID: cad_viewer

jobs:
  build:
    name: Build App Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Set up php 8.3
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: 8.3
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version files
        if: ${{ github.event.inputs.version }}
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          pnpm version $VERSION --no-git-tag-version --no-commit-hooks
          sed -i "s|<version>.*</version>|<version>$VERSION</version>|g" appinfo/info.xml

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: |
          pnpm install --frozen-lockfile
          composer install --no-dev --optimize-autoloader

      - name: Build
        run: |
          pnpm run build
          git submodule update --init --recursive
          make production-setup
          make appstore

      - name: Package artifacts
        env:
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            TAG_NAME="v${INPUT_VERSION}"
          else
            SANITIZED_REF=$(echo "$REF" | sed 's/[^a-zA-Z0-9._-]/_/g')
            TAG_NAME="${SANITIZED_REF}-${SHA:0:8}"
          fi
          cd build/artifacts
          [[ -f "cad_viewer.tar.gz" ]] && mv cad_viewer.tar.gz "cad_viewer-${TAG_NAME}.tar.gz"
          [[ -f "cad_viewer.zip" ]] && mv cad_viewer.zip "cad_viewer-${TAG_NAME}.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.APP_NAME }}-${{ github.run_id }}
          path: build/artifacts/
          retention-days: 90
          compression-level: 6
          overwrite: true
