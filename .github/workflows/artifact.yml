name: Build Nextcloud App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for build (optional)'
        required: false
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Determine build configuration
  setup:
    name: Determine Build Configuration
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.config.outputs.tag_name }}
      is_release: ${{ steps.config.outputs.is_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Determine build configuration
        id: config
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            TAG_NAME="v${INPUT_VERSION}"
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            # For PRs and regular pushes, use branch name and short SHA
            SANITIZED_REF=$(echo "$REF_NAME" | sed 's/[^a-zA-Z0-9._-]/_/g')
            TAG_NAME="${SANITIZED_REF}-${SHA}"
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

  # Call reusable build workflow
  build:
    name: Build App Package
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.event.inputs.version }}
      is_release: ${{ needs.setup.outputs.is_release }}
      tag_name: ${{ needs.setup.outputs.tag_name }}
    needs: setup
