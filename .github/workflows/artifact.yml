--- .github/workflows/artifact.yml (原始)


+++ .github/workflows/artifact.yml (修改后)
name: Artifact

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - name: Get Info
        run: |
          echo "version=$(grep -Eo '[0-9]+(\.[0-9]+)+' CHANGELOG.md | head -n 1)" >> $GITHUB_OUTPUT
        id: info
      - name: Build Artifact
        run: |
          cd ${{ github.workspace }}
          cwd=$(pwd)
          git submodule update --init --recursive 2>/dev/null || true
          npm install
          npm run build
          composer install --no-dev --optimize-autoloader
          mkdir -p nextcloud-cad-viewer
          rsync -av --exclude='nextcloud-cad-viewer' . nextcloud-cad-viewer
          cd nextcloud-cad-viewer
          rm -rf ./.github/
          rm -rf ./.git/
          rm -rf ./node_modules/
          rm -rf ./src/
          rm -rf ./tests/
          rm -rf ./docs/
          rm -f ./.eslintrc.js
          rm -f ./.gitignore
          rm -f ./.gitmodules
          rm -f ./.stylelintrc.json
          rm -f ./composer.json
          rm -f ./composer.lock
          rm -f ./npm-shrinkwrap.json
          rm -f ./package.json
          rm -f ./ruleset.xml
          rm -f ./stylelint.config.js
          rm -f ./webpack.config.js
          rm -f ./webpack.js
          rm -f ./phpunit.xml
          rm -f ./jest.config.js
          rm -f ./commitlint.config.js
          rm -rf ./.phpunit.cache/
          rm -rf ./vendor/
          cd $cwd
          tar -czvf nextcloud-cad-viewer.tar.gz nextcloud-cad-viewer
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextcloud-cad-viewer
          path: nextcloud-cad-viewer.tar.gz
