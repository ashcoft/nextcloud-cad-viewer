name: Build Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for build (optional, e.g., 0.0.9)'
        required: false
        type: string
      upload_release:
        description: 'Upload to GitHub Release (provide tag, e.g., v0.0.9)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'lib/**'
      - 'css/**'
      - 'templates/**'
      - 'appinfo/**'
      - 'img/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'webpack.config.js'
      - 'tsconfig.json'
      - 'babel.config.js'
      - 'Makefile'
      - 'composer.json'
      - 'composer.lock'

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: build-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  APP_NAME: cad_viewer

jobs:
  build:
    name: Build App Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2 # v2.37.2
        with:
          php-version: 8.4
          coverage: none

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update version files
        if: ${{ github.event.inputs.version }}
        run: |
          pnpm version ${{ github.event.inputs.version }} --no-git-tag-version --no-commit-hooks
          sed -i "s|<version>.*</version>|<version>${{ github.event.inputs.version }}</version>|g" appinfo/info.xml

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          composer install --no-dev --optimize-autoloader

      - name: Build
        run: |
          pnpm run build
          make production-setup
          make appstore

      - name: List built artifacts
        run: |
          echo "=== Built Artifacts ==="
          find build/artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) | head -20

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}
          path: |
            build/artifacts/*.tar.gz
            build/artifacts/*.zip
          retention-days: 90
          compression-level: 6
          overwrite: true

      - name: Upload to GitHub Release
        if: ${{ github.event.inputs.upload_release }}
        run: |
          TAG="${{ github.event.inputs.upload_release }}"
          APP_NAME="cad_viewer"

          # Upload tar.gz
          TARBALL="build/artifacts/${APP_NAME}.tar.gz"
          if [ -f "$TARBALL" ]; then
            gh release upload "$TAG" "$TARBALL" --clobber
          fi

          # Upload zip
          ZIPFILE="build/artifacts/${APP_NAME}.zip"
          if [ -f "$ZIPFILE" ]; then
            gh release upload "$TAG" "$ZIPFILE" --clobber
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
