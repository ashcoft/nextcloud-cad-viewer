name: Build Nextcloud App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for build (e.g., 0.0.9)'
        required: false
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  APP_NAME: cad_viewer

jobs:
  # Determine build configuration
  setup:
    name: Determine Build Configuration
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.config.outputs.tag_name }}
      is_release: ${{ steps.config.outputs.is_release }}
      version: ${{ steps.config.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Determine build configuration
        id: config
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            TAG_NAME="v${INPUT_VERSION}"
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "version=${INPUT_VERSION}" >> $GITHUB_OUTPUT
          else
            # For PRs and regular pushes, use branch name and short SHA
            SANITIZED_REF=$(echo "$REF" | sed 's|refs/heads/||' | sed 's/[^a-zA-Z0-9._-]/_/g')
            TAG_NAME="${SANITIZED_REF}-${SHA:0:8}"
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "version=0.0.0" >> $GITHUB_OUTPUT
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

  build:
    name: Build App Package
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Read package.json node and pnpm engines version
        uses: skjnldsv/read-package-engines-version-actions@06d6baf7d8f41934ab630e97d9e6c0bc9c9ac5e4 # v3
        id: versions
        with:
          fallbackNode: '^24'
          fallbackNpm: '^10'

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        if: ${{ steps.versions.outputs.nodeVersion }}

      - name: Set up node ${{ steps.versions.outputs.nodeVersion }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: ${{ steps.versions.outputs.nodeVersion }}
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}
          cache: 'pnpm'

      - name: Set up php 8.3
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: 8.3
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version files for release
        if: ${{ needs.setup.outputs.is_release == 'true' }}
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          # Update package.json version
          pnpm version $VERSION --no-git-tag-version --no-commit-hooks

          # Update info.xml version using proper XML-aware replacement
          sed -i "s|<version>.*</version>|<version>$VERSION</version>|g" appinfo/info.xml

          # Increment CHANGELOG.md: move Unreleased section to version entry
          python3 << 'EOF'
          import re
          import datetime

          changelog_path = 'CHANGELOG.md'
          version = '$VERSION'

          with open(changelog_path, 'r') as f:
              content = f.read()

          today = datetime.date.today().strftime('%Y-%m-%d')

          # Check if Unreleased section exists
          unreleased_pattern = r'(## \[Unreleased\]\n(?:.*?\n)*?)(?=## \[|\Z)'
          match = re.search(unreleased_pattern, content, re.DOTALL)

          if match:
              unreleased_section = match.group(1)

              # Replace Unreleased with new version
              new_version_section = f"## [{version}] - {today}\n\n### Changed\n\n- Initial release\n\n---\n\n{unreleased_section}"
              content = content.replace(unreleased_section, new_version_section, 1)

              with open(changelog_path, 'w') as f:
                  f.write(content)

              print(f"Updated CHANGELOG.md with version {version}")
          else:
              print("No Unreleased section found, skipping changelog update")
          EOF

      - name: Install pnpm dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: pnpm install --frozen-lockfile

      - name: Install composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Build JavaScript
        run: pnpm run build

      - name: Build Nextcloud App
        run: |
          git submodule update --init --recursive
          make production-setup
          make appstore

      - name: Package Nextcloud app
        env:
          TAG_NAME: ${{ needs.setup.outputs.tag_name }}
        run: |
          cd build/artifacts
          if [ -f "cad_viewer.tar.gz" ]; then
            mv cad_viewer.tar.gz "cad_viewer-${TAG_NAME}.tar.gz"
          fi
          if [ -f "cad_viewer.zip" ]; then
            mv cad_viewer.zip "cad_viewer-${TAG_NAME}.zip"
          fi
          ls -la

      - name: Upload all artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ needs.setup.outputs.tag_name }}
          path: build/artifacts/
          retention-days: 90
          compression-level: 6
          overwrite: true
