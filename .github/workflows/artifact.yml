name: Build and Package Nextcloud App

on:
  workflow_call:
    inputs:
      version:
        description: 'Version for build (optional)'
        required: false
        type: string
      is_release:
        description: 'Whether this is a release build'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Tag name for artifacts'
        required: false
        type: string
    outputs:
      tag_name:
        description: "The tag name used for the artifacts"
        value: ${{ jobs.build.outputs.tag_name }}
      version:
        description: "The version used for the artifacts"
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  APP_NAME: cad_viewer

jobs:
  build:
    name: Build App Package
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Read package.json node and pnpm engines version
        uses: skjnldsv/read-package-engines-version-actions@06d6baf7d8f41934ab630e97d9e6c0bc9c9ac5e4 # v3
        id: versions
        with:
          fallbackNode: '^24'
          fallbackNpm: '^10'

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        if: ${{ steps.versions.outputs.nodeVersion }}

      - name: Set up node ${{ steps.versions.outputs.nodeVersion }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: ${{ steps.versions.outputs.nodeVersion }}
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}
          cache: 'pnpm'

      - name: Set up php 8.3
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: 8.3
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version and tag
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
            TAG_NAME="v${VERSION}"
          else
            VERSION=$(node -p "require('./package.json').version")
            if [[ -n "${{ inputs.tag_name }}" ]]; then
              TAG_NAME="${{ inputs.tag_name }}"
            else
              TAG_NAME="v${VERSION}"
            fi
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Update version files
        if: ${{ inputs.version }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [[ "$CURRENT" == "$VERSION" ]]; then
            echo "Version already $VERSION, skipping update"
          else
            pnpm version $VERSION --no-git-tag-version --no-commit-hooks
            sed -i "s|<version>.*</version>|<version>$VERSION</version>|g" appinfo/info.xml
          fi

      - name: Install dependencies
        run: |
          make npm-init
          composer install --no-dev --optimize-autoloader

      - name: Build and Package
        run: |
          make production-setup
          make all

      - name: Rename artifacts
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          cd build/artifacts
          # App bundles
          if [ -f "cad_viewer.tar.gz" ]; then
            mv cad_viewer.tar.gz "cad_viewer-${TAG_NAME}.tar.gz"
          fi
          if [ -f "cad_viewer.zip" ]; then
            mv cad_viewer.zip "cad_viewer-${TAG_NAME}.zip"
          fi
          # Source archives (already named by make source)
          if [ -f "cad_viewer-source.tar.gz" ]; then
            mv cad_viewer-source.tar.gz "nextcloud-cad-viewer-${TAG_NAME}.tar.gz"
          fi
          if [ -f "cad_viewer-source.zip" ]; then
            mv cad_viewer-source.zip "nextcloud-cad-viewer-${TAG_NAME}.zip"
          fi
          ls -R .

      - name: Upload all artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ${{ env.APP_NAME }}-${{ steps.version.outputs.tag_name }}
          path: build/artifacts/
          retention-days: 5
          compression-level: 6
          overwrite: true
