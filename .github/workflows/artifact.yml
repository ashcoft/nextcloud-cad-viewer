name: Build Nextcloud App

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for build (optional)'
        required: false
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.get-version.outputs.tag_name || 'pr-build' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Get version
        id: get-version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            TAG_NAME="v${INPUT_VERSION}"
          else
            # Sanitize ref name to remove invalid characters for artifact names
            SANITIZED_REF=$(echo "$REF_NAME" | sed 's/[^a-zA-Z0-9._-]/_/g')
            TAG_NAME="${SANITIZED_REF}-${SHA}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Read package.json node and pnpm engines version
        uses: skjnldsv/read-package-engines-version-actions@06d6baf7d8f41934ab630e97d9e6c0bc9c9ac5e4 # v3
        id: versions
        with:
          fallbackNode: '^24'
          fallbackNpm: '^10'

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        if: ${{ steps.versions.outputs.nodeVersion }}

      - name: Set up node ${{ steps.versions.outputs.nodeVersion }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: ${{ steps.versions.outputs.nodeVersion }}
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}
          cache: 'pnpm'

      - name: Set up php 8.3
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: 8.3
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: pnpm install --frozen-lockfile

      - name: Install composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Build JavaScript
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: pnpm run build

      - name: Build Nextcloud App
        run: |
          git submodule update --init --recursive
          make production-setup
          make appstore

      - name: Upload Artifact TAR.GZ
        uses: actions/upload-artifact@v4
        with:
          name: cad_viewer-app-tar-${{ steps.get-version.outputs.tag_name }}
          path: build/artifacts/cad_viewer.tar.gz
          retention-days: 90

      - name: Upload Artifact ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cad_viewer-app-zip-${{ steps.get-version.outputs.tag_name }}
          path: build/artifacts/cad_viewer.zip
          retention-days: 90
