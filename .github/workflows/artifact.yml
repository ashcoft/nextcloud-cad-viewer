name: Build Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for build (optional, e.g., 0.0.9)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'webpack.config.js'
      - 'tsconfig.json'
      - 'babel.config.js'
      - 'Makefile'
      - 'composer.json'
      - 'composer.lock'
      - 'lib/**'
      - 'css/**'
      - 'templates/**'
      - 'appinfo/**'
      - 'img/**'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: build-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  APP_NAME: cad_viewer

jobs:
  build:
    name: Build App Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2 # v2.37.2
        with:
          php-version: 8.4
          coverage: none

      - name: Update version files
        if: ${{ github.event.inputs.version }}
        run: |
          pnpm version ${{ github.event.inputs.version }} --no-git-tag-version --no-commit-hooks
          sed -i "s|<version>.*</version>|<version>${{ github.event.inputs.version }}</version>|g" appinfo/info.xml

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          composer install --no-dev --optimize-autoloader

      - name: Build
        run: |
          pnpm run build
          make production-setup
          make appstore

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.APP_NAME }}-${{ github.run_number }}
          path: build/artifacts/
          retention-days: 90
          compression-level: 6
          overwrite: true
