name: Build Nextcloud App

on:
  workflow_call:
    inputs:
      version:
        description: 'Version for build (optional)'
        required: false
        type: string
      is_release:
        description: 'Whether this is a release build'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Tag name for artifacts'
        required: false
        type: string

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  APP_NAME: cad_viewer

jobs:
  build:
    name: Build App Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Read package.json node and pnpm engines version
        uses: skjnldsv/read-package-engines-version-actions@06d6baf7d8f41934ab630e97d9e6c0bc9c9ac5e4 # v3
        id: versions
        with:
          fallbackNode: '^24'
          fallbackNpm: '^10'

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        if: ${{ steps.versions.outputs.nodeVersion }}

      - name: Set up node ${{ steps.versions.outputs.nodeVersion }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: ${{ steps.versions.outputs.nodeVersion }}
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}
          cache: 'pnpm'

      - name: Set up php 8.3
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: 8.3
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from package.json
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "tag_name=v${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "tag_name=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Update version files
        if: ${{ inputs.version }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [[ "$CURRENT" == "$VERSION" ]]; then
            echo "Version already $VERSION, skipping update"
          else
            pnpm version $VERSION --no-git-tag-version --no-commit-hooks
            sed -i "s|<version>.*</version>|<version>$VERSION</version>|g" appinfo/info.xml
          fi
      - name: Install pnpm dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: pnpm install --frozen-lockfile

      - name: Install composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Build JavaScript
        run: pnpm run build

      - name: Build Nextcloud App
        run: |
          git submodule update --init --recursive
          make production-setup
          make appstore

      - name: Package Nextcloud app
        env:
          TAG_NAME: ${{ inputs.tag_name || steps.version.outputs.tag_name }}
        run: |
          cd build/artifacts
          if [ -f "cad_viewer.tar.gz" ]; then
            mv cad_viewer.tar.gz "cad_viewer-${TAG_NAME}.tar.gz"
          fi
          if [ -f "cad_viewer.zip" ]; then
            mv cad_viewer.zip "cad_viewer-${TAG_NAME}.zip"
          fi

      - name: Create source archives
        if: ${{ inputs.is_release }}
        env:
          TAG_NAME: ${{ inputs.tag_name || steps.version.outputs.tag_name }}
        run: |
          mkdir -p build/artifacts
          git archive --format=tar.gz -o build/artifacts/nextcloud-cad-viewer-${TAG_NAME}.tar.gz HEAD
          git archive --format=zip -o build/artifacts/nextcloud-cad-viewer-${TAG_NAME}.zip HEAD

      - name: Upload all artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ inputs.tag_name || steps.version.outputs.tag_name }}
          path: build/artifacts/
          retention-days: 90
          compression-level: 6
          overwrite: true
