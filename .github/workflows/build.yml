name: Build CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Determine build configuration
  setup:
    name: Determine Build Configuration
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.config.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Determine build configuration
        id: config
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          # For PRs and regular pushes, use branch name and short SHA
          SANITIZED_REF=$(echo "${{ github.head_ref || github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/_/g')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG_NAME="${SANITIZED_REF}-${SHORT_SHA}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

  build:
    name: Build
    needs: setup
    uses: ./.github/workflows/artifact.yml
    with:
      tag_name: ${{ needs.setup.outputs.tag_name }}
      is_release: false
