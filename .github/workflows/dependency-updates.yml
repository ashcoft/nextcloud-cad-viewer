name: Dependency Updates

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  update-nextcloud-ocp:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        tools: composer:v2

    - name: Update nextcloud/ocp
      run: |
        composer require --dev nextcloud/ocp:dev-master
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add composer.json composer.lock
        git commit -m "chore(deps): update nextcloud/ocp to latest" || echo "No changes to commit"

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "chore(deps): update nextcloud/ocp to latest"
        title: "chore(deps): update nextcloud/ocp to latest"
        body: "Automated update of nextcloud/ocp to the latest version."
        branch: "update-nextcloud-ocp"
        delete-branch: true
