name: Lint info.xml

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on: pull_request

permissions:
  contents: read

concurrency:
  group: lint-info-xml-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  xml-linters:
    runs-on: ubuntu-latest

    name: info.xml lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download schema
        run: wget https://raw.githubusercontent.com/nextcloud/appstore/master/nextcloudappstore/api/v1/release/info.xsd

      - name: Lint info.xml
        uses: ChristophWurst/xmllint-action@36f2a302f84f8c83fceea0b9c59e1eb4a616d3c1 # v1.2
        with:
          xml-file: ./appinfo/info.xml
          xml-schema-file: ./info.xsd

      # appinfo/info.xml and package.json must stay in sync: the release
      # pipeline packages the archive from info.xml, and a drift previously
      # shipped archives carrying the previous tag's version.
      - name: Check info.xml and package.json versions match
        run: |
          INFO=$(sed -n 's/.*<version>\(.*\)<\/version>.*/\1/p' appinfo/info.xml | head -n 1 | xargs)
          PKG=$(node -p "require('./package.json').version")
          echo "info.xml=$INFO package.json=$PKG"
          if [ "$INFO" != "$PKG" ]; then
            echo "::error::Version mismatch: appinfo/info.xml ($INFO) != package.json ($PKG)"
            exit 1
          fi
