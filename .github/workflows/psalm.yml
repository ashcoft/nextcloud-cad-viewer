name: Static analysis

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on: pull_request

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      src: ${{ steps.changes.outputs.src }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            src:
              - '.github/workflows/**'
              - 'appinfo/**'
              - 'lib/**'
              - 'templates/**'
              - 'tests/**'
              - 'vendor/**'
              - 'vendor-bin/**'
              - '.php-cs-fixer.dist.php'
              - 'composer.json'
              - 'composer.lock'
              - 'package.json'
              - 'pnpm-lock.yaml'

  static-analysis:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.src == 'true'

    name: static-psalm-analysis
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get php version
        id: versions
        uses: icewind1991/nextcloud-version-matrix@cd0211ffcef1065e2020cd579e4843b8746e7a58 # v1.3.3

      - name: Check enforcement of minimum PHP version 8.4 in psalm.xml
        run: grep 'phpVersion="8.4' psalm.xml

      - name: Set up php 8.4
        uses: shivammathur/setup-php@v2 # v2.37.2
        with:
          php-version: '8.4'
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
          coverage: none
          ini-file: development
          # Temporary workaround for missing pcntl_* functions
          ini-values: disable_functions=
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer i --ignore-platform-reqs && composer dump-autoload --ignore-platform-reqs

      - name: Install nextcloud/ocp
        run: composer bin nextcloud-ocp require --dev nextcloud/ocp:dev-${{ steps.versions.outputs.branches-max }} --ignore-platform-reqs --with-dependencies

      - name: Run coding standards check
        env:
          COMPOSER_IGNORE_PLATFORM_REQS: "1"
        run: composer run psalm -- --threads=1 --monochrome --no-progress --output-format=github
