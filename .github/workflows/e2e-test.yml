name: E2E Tests

on:
  pull_request:
  push:
    branches:
      - main
      - stable*

permissions:
  contents: read

concurrency:
  group: e2e-tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  APP_NAME: cad_viewer
  CYPRESS_INSTALL_BINARY: 0

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    outputs:
      src: ${{ steps.changes.outputs.src }}

    steps:
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: changes
        continue-on-error: true
        with:
          filters: |
            src:
              - 'src/**'
              - 'tests/e2e/**'
              - 'package.json'
              - 'pnpm-lock.yaml'

  e2e-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src != 'false'

    steps:
      - name: Checkout server
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          submodules: true
          repository: nextcloud/server
          ref: stable33

      - name: Checkout app
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          path: apps/${{ env.APP_NAME }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
          coverage: none
          ini-file: development
          ini-values: disable_functions=
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Nextcloud
        env:
          DB_PORT: 4444
          DB_PASS: ${{ secrets.DB_TEST_PASS || 'rootpassword' }}
          ADMIN_PASS: ${{ secrets.ADMIN_TEST_PASS || 'admin' }}
        run: |
          mkdir data
          ./occ maintenance:install --verbose --database=sqlite --database-name=nextcloud --database-host=127.0.0.1 --database-port=$DB_PORT --database-user=root --database-pass=$DB_PASS --admin-user admin --admin-pass $ADMIN_PASS
          ./occ app:enable --force ${{ env.APP_NAME }}

      - name: Start Nextcloud server
        run: php -S localhost:8080 &

      - name: Install app dependencies
        working-directory: apps/${{ env.APP_NAME }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: apps/${{ env.APP_NAME }}
        env:
          BASE_URL: http://localhost:8080
          NEXTCLOUD_URL: http://localhost:8080
        run: npx playwright test --reporter=list

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/${{ env.APP_NAME }}/playwright-report/
          retention-days: 14

      - name: Print logs on failure
        if: failure()
        run: |
          cat data/nextcloud.log 2>/dev/null || echo "No logs available"
