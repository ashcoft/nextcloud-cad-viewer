name: Cleanup PR Comments

on:
  schedule:
    - cron: '0 * * * *'
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  cleanup-comments:
    runs-on: ubuntu-latest
    steps:
      - name: Delete unwanted comments from PRs
        run: |
          # Get the issue/PR number from the event
          NUMBER="${{ github.event.issue.number }}"

          # Get comments and process them
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$NUMBER/comments" | \
          jq -r '.[] | "\(.id) \(.user.login) \(.body // "")"' | while read -r ID AUTHOR BODY; do
            # Delete unwanted bot comments
            if [[ "$AUTHOR" == *"qodo-code-review[bot]"* ]] && [[ "$BODY" == *"reviews are paused"* ]]; then
              echo "Deleting Qodo comment: $ID"
              curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/issues/comments/$ID"
            fi
            if [[ "$AUTHOR" == *"chatgpt-codex-connector[bot]"* ]] && [[ "$BODY" == *"usage limits"* ]]; then
              echo "Deleting Codex comment: $ID"
              curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/issues/comments/$ID"
            fi
            if [[ "$AUTHOR" == *"mergeguard[bot]"* ]] && [[ "$BODY" == *"Monthly free review limit reached"* ]]; then
              echo "Deleting MergeGuard comment: $ID"
              curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/issues/comments/$ID"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
