name: Cleanup PR Comments

on:
  workflow_dispatch:
  schedule:
    # Run every hour to clean up unwanted comments
    - cron: '0 * * * *'
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  cleanup-comments:
    runs-on: ubuntu-latest
    steps:
      - name: Delete unwanted comments from PRs
        run: |
          # Get the issue/PR number from the event
          if [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            NUMBER="${{ github.event.issue.number }}"
          else
            NUMBER="${{ github.event.number }}"
          fi

          # Get all PR/Issue comments using curl
          HTTP_CODE=$(curl -s -o /tmp/comments.json -w "%{http_code}" -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$NUMBER/comments")

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "Error: Failed to fetch comments (HTTP $HTTP_CODE)"
            cat /tmp/comments.json
            exit 1
          fi

          # Parse comments - extract id, user.login, and first 150 chars of body
          jq -r '.[] | "\(.id)|\(.user.login)|\(.body // "" | gsub("\n"; " ") | .[0:150])"' /tmp/comments.json | while IFS='|' read -r ID AUTHOR BODY; do
            if [[ -z "$ID" ]] || [[ "$ID" == "null" ]]; then
              continue
            fi

            # Delete comments from qodo-code-review bot when reviews are paused
            if [[ "$AUTHOR" == "qodo-code-review[bot]" ]] && [[ "$BODY" == *"reviews are paused"* ]]; then
              echo "Deleting Qodo paused review comment: $ID"
              DELETE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/issues/comments/$ID")
              if [[ "$DELETE_CODE" != "204" ]]; then
                echo "Warning: Failed to delete comment $ID (HTTP $DELETE_CODE)"
              fi
            fi

            # Delete comments from chatgpt-codex-connector when usage limits reached
            if [[ "$AUTHOR" == "chatgpt-codex-connector[bot]" ]] && [[ "$BODY" == *"usage limits"* ]]; then
              echo "Deleting Codex usage limit comment: $ID"
              DELETE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/issues/comments/$ID")
              if [[ "$DELETE_CODE" != "204" ]]; then
                echo "Warning: Failed to delete comment $ID (HTTP $DELETE_CODE)"
              fi
            fi

            # Delete comments from MergeGuard when monthly free review limit reached
            if [[ "$AUTHOR" == "mergeguard[bot]" ]] && [[ "$BODY" == *"Monthly free review limit reached"* ]]; then
              echo "Deleting MergeGuard limit reached comment: $ID"
              DELETE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/issues/comments/$ID")
              if [[ "$DELETE_CODE" != "204" ]]; then
                echo "Warning: Failed to delete comment $ID (HTTP $DELETE_CODE)"
              fi
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
