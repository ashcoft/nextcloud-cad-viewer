name: Linting

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  NODE_VERSION: 20

concurrency:
  group: lint-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint-php:
    runs-on: ubuntu-latest
    name: PHP lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Lint PHP
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l

  lint-php-cs:
    runs-on: ubuntu-latest
    name: PHP-CS-Fixer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install PHP-CS-Fixer
        run: |
          wget -q https://cs.symfony.com/download/php-cs-fixer-v3.phar -O php-cs-fixer
          chmod +x php-cs-fixer

      - name: Run PHP-CS-Fixer
        run: |
          php php-cs-fixer fix --dry-run --diff --rules=@PSR12 .

  lint:
    runs-on: ubuntu-latest
    name: Lint

    defaults:
      run:
        working-directory: ./src

    steps:
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm ci

      - name: Code Linting
        run: npx eslint *.js || true

      - name: CSS Linting
        run: npx stylelint ../css/*.css || true

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: [lint-php, lint-php-cs, lint]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "PHP lint: ${{ needs.lint-php.result }}"
          echo "PHP-CS-Fixer: ${{ needs.lint-php-cs.result }}"
          echo "Lint: ${{ needs.lint.result }}"
