name: Linting

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint-php:
    runs-on: ubuntu-latest
    name: php-lint

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Lint PHP
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l

  lint-php-cs:
    runs-on: ubuntu-latest
    name: php-cs

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install PHP-CS-Fixer
        run: |
          wget https://cs.symfony.com/download/php-cs-fixer-v3.phar -O php-cs-fixer
          chmod +x php-cs-fixer

      - name: Run PHP-CS-Fixer
        run: |
          php php-cs-fixer fix --dry-run --diff --diff-format=udiff --rules=@PSR12 .

  lint:
    runs-on: ubuntu-latest
    name: ESLint + Stylelint

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Code Linting
        run: npm run lint || true

      - name: CSS Linting
        run: npx stylelint "css/**/*.css" || true

  lint-typescript:
    runs-on: ubuntu-latest
    name: TypeScript

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit || true

  lint-info-xml:
    runs-on: ubuntu-latest
    name: info.xml

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Validate info.xml
        run: xmllint --noout appinfo/info.xml || true

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: [lint-php, lint-php-cs, lint, lint-typescript, lint-info-xml]
    if: always()
    name: lint-summary

    steps:
      - name: Summary status
        run: |
          if [[ "${{ needs.lint-php.result }}" != "success" ]] && [[ "${{ needs.lint-php.result }}" != "skipped" ]]; then exit 1; fi
          if [[ "${{ needs.lint-php-cs.result }}" != "success" ]] && [[ "${{ needs.lint-php-cs.result }}" != "skipped" ]]; then exit 1; fi
          if [[ "${{ needs.lint.result }}" != "success" ]] && [[ "${{ needs.lint.result }}" != "skipped" ]]; then exit 1; fi
          if [[ "${{ needs.lint-typescript.result }}" != "success" ]] && [[ "${{ needs.lint-typescript.result }}" != "skipped" ]]; then exit 1; fi
          if [[ "${{ needs.lint-info-xml.result }}" != "success" ]] && [[ "${{ needs.lint-info-xml.result }}" != "skipped" ]]; then exit 1; fi
