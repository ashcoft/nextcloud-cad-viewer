name: Integration Tests

on:
  workflow_dispatch:
  push:
    branches: [master, develop]
    paths:
      - 'lib/**'
      - 'tests/integration/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/integration-tests.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - 'lib/**'
      - 'tests/integration/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/integration-tests.yml'

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      php-max: ${{ steps.versions.outputs.php-max }}
      branches-min: ${{ steps.versions.outputs.branches-min }}
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Get version matrix
        id: versions
        uses: icewind1991/nextcloud-version-matrix@v1.3.2

  integration-mariadb:
    runs-on: ubuntu-latest
    needs: matrix

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Set up PHP ${{ needs.matrix.outputs.php-max }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ needs.matrix.outputs.php-max }}
        extensions: pdo, pdo_mysql

    - name: Run MariaDB integration tests
      run: |
        php tests/integration/run.php --db=mariadb
      env:
        DB_HOST: localhost
        DB_NAME: testdb
        DB_USER: root
        DB_PASS: root

  integration-mysql:
    runs-on: ubuntu-latest
    needs: matrix

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Set up PHP ${{ needs.matrix.outputs.php-max }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ needs.matrix.outputs.php-max }}
        extensions: pdo, pdo_mysql

    - name: Run MySQL integration tests
      run: |
        php tests/integration/run.php --db=mysql
      env:
        DB_HOST: localhost
        DB_NAME: testdb
        DB_USER: root
        DB_PASS: root

  integration-pgsql:
    runs-on: ubuntu-latest
    needs: matrix

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Set up PHP ${{ needs.matrix.outputs.php-max }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ needs.matrix.outputs.php-max }}
        extensions: pdo, pdo_pgsql

    - name: Run PostgreSQL integration tests
      run: |
        php tests/integration/run.php --db=pgsql
      env:
        DB_HOST: localhost
        DB_NAME: testdb
        DB_USER: postgres
        DB_PASS: postgres

  integration-sqlite:
    runs-on: ubuntu-latest
    needs: matrix

    steps:
    - uses: actions/checkout@v4

    - name: Set up PHP ${{ needs.matrix.outputs.php-max }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ needs.matrix.outputs.php-max }}
        extensions: pdo, pdo_sqlite

    - name: Run SQLite integration tests
      run: |
        php tests/integration/run.php --db=sqlite

  integration-oci:
    runs-on: ubuntu-latest
    needs: matrix

    steps:
    - uses: actions/checkout@v4

    - name: Set up PHP ${{ needs.matrix.outputs.php-max }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ needs.matrix.outputs.php-max }}
        extensions: pdo, oci8

    - name: Run OCI integration tests
      run: |
        php tests/integration/run.php --db=oci
      continue-on-error: true
