name: Integration Tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  integration-sqlite:
    runs-on: ubuntu-latest
    name: sqlite

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        extensions: pdo, pdo_sqlite
        coverage: none

    - name: Run SQLite integration tests
      run: php tests/integration/run.php --db=sqlite
      run: php tests/integration/run.php --db=sqlite


  integration-federation:
    runs-on: ubuntu-latest
    name: federation

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        tools: composer:v2
        coverage: none

    - name: Install dependencies
      run: composer install --no-interaction
      
    - name: Run federation integration tests
      run: php tests/integration/federation.php
      continue-on-error: true

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: [integration-sqlite, integration-federation]
    if: always()
    name: integration-summary

    steps:
    - name: Summary status
      run: |
        if [[ "${{ needs.integration-sqlite.result }}" != "success" ]] && [[ "${{ needs.integration-sqlite.result }}" != "skipped" ]]; then exit 1; fi
        if [[ "${{ needs.integration-federation.result }}" != "success" ]] && [[ "${{ needs.integration-federation.result }}" != "skipped" ]]; then exit 1; fi
