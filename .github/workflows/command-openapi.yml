# This workflow is provided via the organization template repository
#
# https://github.com/nextcloud/.github
# https://docs.github.com/en/actions/learn-github-actions/sharing-workflows-with-your-organization
#
# Security: This workflow uses the "Split Workflow Pattern" to avoid the untrusted checkout vulnerability:
# 1. The 'init' job handles only permission checks and comments (privileged but no code checkout)
# 2. It triggers 'openapi.yml' workflow (which uses pull_request trigger - unprivileged)
# 3. The openapi.yml workflow processes PR code safely without elevated privileges
#
# See: https://securitylab.github.com/resources/github-actions-untrusted-input
#
# SPDX-FileCopyrightText: 2021-2024 Nextcloud GmbH and Nextcloud contributors
# SPDX-License-Identifier: MIT

name: OpenAPI Command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  init:
    runs-on: ubuntu-latest

    # On pull requests and if the comment starts with `/openapi`
    if: github.event.issue.pull_request != '' && startsWith(github.event.comment.body, '/openapi')

    outputs:
      git_path: ${{ steps.git-path.outputs.path }}
      arg1: ${{ steps.command.outputs.arg1 }}
      arg2: ${{ steps.command.outputs.arg2 }}
      head_ref: ${{ steps.pr-info.outputs.head_ref }}
      base_ref: ${{ steps.pr-info.outputs.base_ref }}
      pr_number: ${{ steps.pr-info.outputs.pr_number }}

    steps:
      - name: Get repository from pull request comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: get-repository
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const pull = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const repositoryName = pull.data.head?.repo?.full_name
            console.log(repositoryName)
            return repositoryName

      - name: Disabled on forks
        if: ${{ fromJSON(steps.get-repository.outputs.result) != github.repository }}
        run: |
          echo 'Can not execute /openapi on forks'
          exit 1

      - name: Check actor permission
        uses: skjnldsv/check-actor-permission@69e92a3c4711150929bca9fcf34448c5bf5526e7 # v3.0
        with:
          require: write

      - name: Add reaction on start
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          token: ${{ secrets.COMMAND_BOT_PAT }}
          repository: ${{ github.event.repository.full_name }}
          comment-id: ${{ github.event.comment.id }}
          reactions: '+1'

      - name: Parse command
        uses: skjnldsv/parse-command-comment@5c955203c52424151e6d0e58fb9de8a9f6a605a1 # v3.1
        id: command

      - name: Init path
        id: git-path
        run: |
          if ${{ startsWith(steps.command.outputs.arg1, '/') }}; then
            echo "path=${{steps.command.outputs.arg1}}" >> $GITHUB_OUTPUT
          else
            echo "path=${{steps.command.outputs.arg2}}" >> $GITHUB_OUTPUT
          fi

      - name: Get PR info
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: pr-info
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const pull = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            core.setOutput('head_ref', pull.data.head.ref);
            core.setOutput('base_ref', pull.data.base.ref);
            core.setOutput('pr_number', context.issue.number);

      # SECURITY FIX: Instead of checking out untrusted code with privileged token,
      # trigger the openapi.yml workflow (which uses pull_request trigger - unprivileged)
      - name: Trigger OpenAPI workflow
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'openapi.yml',
              ref: '${{ steps.pr-info.outputs.head_ref }}',
              inputs: {
                path: '${{ steps.git-path.outputs.path }}',
                command: '${{ steps.command.outputs.arg1 }}',
                pr_number: '${{ steps.pr-info.outputs.pr_number }}',
                base_ref: '${{ steps.pr-info.outputs.base_ref }}',
                comment_id: '${{ github.event.comment.id }}'
              }
            });
            console.log('Triggered openapi.yml workflow');

      - name: Add reaction on failure
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        if: failure()
        with:
          token: ${{ secrets.COMMAND_BOT_PAT }}
          repository: ${{ github.event.repository.full_name }}
          comment-id: ${{ github.event.comment.id }}
          reactions: '-1'
