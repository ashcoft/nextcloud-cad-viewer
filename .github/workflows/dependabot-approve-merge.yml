name: Auto approve Dependabot PRs

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches:
      - main
      - stable*

permissions:
  contents: read

concurrency:
  group: dependabot-approve-merge-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  auto-approve-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      # for auto-approve step to work
      pull-requests: write
      # for alexwilson/enable-github-automerge-action to approve PRs
      contents: write

    steps:
      - name: Disabled on forks
        if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo 'Can not approve PRs from forks'
          exit 1

      - uses: mdecoleman/pr-branch-name@55795d86b4566d300d237883103f052125cc7508 # v3.0.0
        id: branchname
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: GitHub actions bot approve
        if: startsWith(steps.branchname.outputs.branch, 'dependabot/')
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Enable GitHub auto merge
      - name: Auto merge
        if: startsWith(steps.branchname.outputs.branch, 'dependabot/') && (github.event.action == 'opened' || github.event.action == 'reopened') && (steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: |
          PR_URL="${{ github.event.pull_request.html_url }}"
          echo "Waiting for CI checks to pass before merging..."
          
          # Wait for status checks to be successful (max 10 minutes)
          max_attempts=20
          attempt=0
          
          while [ $attempt -lt $max_attempts ]; do
            # Check if all required checks have passed
            status=$(gh pr status "$PR_URL" --json statusCheckRollup --jq '.currentBranch.statusCheckRollup[] | select(.conclusion == "SUCCESS") | .state' 2>/dev/null | wc -l)
            total_checks=$(gh pr status "$PR_URL" --json statusCheckRollup --jq '.currentBranch.statusCheckRollup | length' 2>/dev/null || echo "0")
            
            if [ "$status" = "$total_checks" ] && [ "$total_checks" != "0" ]; then
              echo "All checks passed! Merging PR..."
              gh pr merge "$PR_URL" --squash --delete-branch
              exit 0
            fi
            
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts: Waiting for checks... (passed: $status/$total_checks)"
            sleep 30
          done
          
          echo "Timeout waiting for checks. Will try to merge anyway if checks passed."
          gh pr merge "$PR_URL" --squash --delete-branch || echo "Merge may have already completed"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
