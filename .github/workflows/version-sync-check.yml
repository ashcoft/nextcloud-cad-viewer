name: Version Sync Check

on:
  pull_request:
    paths:
      - 'package.json'
      - 'appinfo/info.xml'
      - 'release-please-config.json'
      - '.release-please-manifest.json'
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'appinfo/info.xml'

jobs:
  version-sync-check:
    name: Verify Version Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check version sync
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          INFO_VERSION=$(grep -oP '(?<=<version>)[^<]+' appinfo/info.xml)
          MANIFEST_VERSION=$(node -p "require('./.release-please-manifest.json')['.']")

          echo "package.json version:       $PKG_VERSION"
          echo "info.xml version:          $INFO_VERSION"
          echo ".release-please-manifest:  $MANIFEST_VERSION"

          if [ "$PKG_VERSION" != "$INFO_VERSION" ]; then
            echo "ERROR: info.xml version does not match package.json!"
            echo "Expected: $PKG_VERSION, Found: $INFO_VERSION"
            exit 1
          fi

          if [ "$PKG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "ERROR: .release-please-manifest.json version does not match package.json!"
            echo "Expected: $PKG_VERSION, Found: $MANIFEST_VERSION"
            exit 1
          fi

          echo "✓ All versions are synchronized!"
