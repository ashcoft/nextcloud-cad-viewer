name: Version Sync Check

on:
  pull_request:
    paths:
      - 'package.json'
      - 'appinfo/info.xml'
      - 'release-please-config.json'
      - '.release-please-manifest.json'
      - '.github/workflows/version-sync-check.yml'
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'appinfo/info.xml'
      - '.github/workflows/version-sync-check.yml'

jobs:
  version-sync-check:
    name: Verify Version Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check if only packageManager changed
        id: skip-check
        run: |
          # For PRs, compare against the merge-base
          COMPARE_REF="${GITHUB_BASE_REF:-main}"
          MERGE_BASE=$(git merge-base HEAD "$COMPARE_REF" 2>/dev/null || echo "HEAD^")
          
          if git diff --name-only "$MERGE_BASE" | grep -q "^package.json$"; then
            # package.json was changed, extract version from both
            OLD_VERSION=$(git show "$MERGE_BASE:package.json" | node -p "require('./stdin')" 2>/dev/null || echo "")
            NEW_VERSION=$(node -p "require('./package.json').version")
            
            if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "Only packageManager changed, skipping version sync check"
            else
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Check version sync
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          INFO_VERSION=$(grep -oP '(?<=<version>)[^<]+' appinfo/info.xml)
          MANIFEST_VERSION=$(node -p "require('./.release-please-manifest.json')['.']")

          echo "package.json version:       $PKG_VERSION"
          echo "info.xml version:          $INFO_VERSION"
          echo ".release-please-manifest:  $MANIFEST_VERSION"

          if [ "$PKG_VERSION" != "$INFO_VERSION" ]; then
            echo "ERROR: info.xml version does not match package.json!"
            echo "Expected: $PKG_VERSION, Found: $INFO_VERSION"
            exit 1
          fi

          if [ "$PKG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "ERROR: .release-please-manifest.json version does not match package.json!"
            echo "Expected: $PKG_VERSION, Found: $MANIFEST_VERSION"
            exit 1
          fi

          echo "✓ All versions are synchronized!"
