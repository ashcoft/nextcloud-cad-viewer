name: Security Scanning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'  # Daily at 3 AM UTC

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  matrix:
    runs-on: ubuntu-latest-low
    outputs:
      php-max: ${{ steps.versions.outputs.php-max }}
    steps:
      - name: Checkout app
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Get version matrix
        id: versions
        uses: icewind1991/nextcloud-version-matrix@8a7bac6300b2f0f3100088b297995a229558ddba # v1.3.2

  codeql-analyze:
    runs-on: ubuntu-latest
    needs: matrix
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: javascript, php
        queries: security-extended
        
    - name: Set up PHP
      uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
      with:
        php-version: ${{ needs.matrix.outputs.php-max }}
        tools: composer:v2
        
    - name: Install dependencies
      run: |
        composer install --no-interaction --ignore-platform-reqs
        npm ci --legacy-peer-deps
        
    - name: Build project
      run: |
        NODE_OPTIONS="--max-old-space-size=4096" npm run build || true
        
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:multiple"

  psalm-security:
    runs-on: ubuntu-latest
    needs: [matrix, codeql-analyze]
    
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    
    - name: Set up PHP
      uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
      with:
        php-version: ${{ needs.matrix.outputs.php-max }}
        tools: composer:v2
        
    - name: Install dependencies
      run: composer install --no-interaction --ignore-platform-reqs
      
    - name: Install Psalm
      run: composer require --dev vimeo/psalm --ignore-platform-reqs
      
    - name: Run Psalm with taint analysis
      run: vendor/bin/psalm --taint-analysis --output-format=github || true

  trivy-scan:
    runs-on: ubuntu-latest
    needs: codeql-analyze
    
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'
        
    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
        category: trivy

  osv-scanner:
    runs-on: ubuntu-latest
    needs: codeql-analyze
    
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    
    - name: Install OSV-Scanner
      run: |
        go install github.com/google/osv-scanner/cmd/osv-scanner@latest
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
        
    - name: Run OSV-Scanner
      run: |
        osv-scanner --format=sarif --output=osv-results.sarif . || true
        
    - name: Upload OSV results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'osv-results.sarif'
        category: osv
