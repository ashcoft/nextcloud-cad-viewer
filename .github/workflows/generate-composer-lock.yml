name: Generate composer.lock

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@9b3a5bbd9ed3de3b76268f6a5c5a0f3aa8eea6d6 # v2.37.0
        with:
          php-version: '8.4'
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib

      - name: Install dependencies
        run: composer update --no-interaction --ignore-platform-reqs

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: regenerate composer.lock'
          title: 'chore: regenerate composer.lock'
          body: 'Regenerated composer.lock with PHP 8.4'
          branch: composer-lock-update
          delete-branch: true
