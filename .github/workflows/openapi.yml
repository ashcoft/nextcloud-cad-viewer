name: OpenAPI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  workflow_dispatch:
    inputs:
      path:
        description: 'Path for OpenAPI files'
        required: false
        type: string
        default: '/'
      command:
        description: 'Command to execute (for /openapi command)'
        required: false
        type: string
      pr_number:
        description: 'PR number for comments'
        required: false
        type: string
      base_ref:
        description: 'Base branch reference'
        required: false
        type: string
      comment_id:
        description: 'Comment ID for reactions'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: openapi-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  openapi:
    runs-on: ubuntu-latest

    if: ${{ github.repository_owner != 'nextcloud-gmbh' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get php version
        id: php_versions
        uses: icewind1991/nextcloud-version-matrix@8a7bac6300b2f0f3100088b297995a229558ddba # v1.3.2

      - name: Set up php
        uses: shivammathur/setup-php@v2 # v2.37.2
        with:
          php-version: ${{ steps.php_versions.outputs.php-available }}
          extensions: xml
          coverage: none
          ini-file: development
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Typescript OpenApi types
        id: check_typescript_openapi
        uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3.1.0
        with:
          files: "src/types/openapi/openapi*.ts"

      - name: Read package.json node and npm engines version
        if: steps.check_typescript_openapi.outputs.files_exists == 'true'
        uses: skjnldsv/read-package-engines-version-actions@06d6baf7d8f41934ab630e97d9e6c0bc9c9ac5e4 # v3
        id: node_versions
        # Continue if no package.json
        continue-on-error: true
        with:
          fallbackNode: '^24'
          fallbackNpm: '^11.3'

      - name: Setup pnpm
        if: ${{ steps.node_versions.outputs.nodeVersion }}
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up node ${{ steps.node_versions.outputs.nodeVersion }}
        if: ${{ steps.node_versions.outputs.nodeVersion }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.node_versions.outputs.nodeVersion }}
          cache: pnpm

      - name: Install dependencies
        if: ${{ steps.node_versions.outputs.nodeVersion }}
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: |
          pnpm install

      - name: Set up dependencies
        if: steps.check_typescript_openapi.outputs.files_exists == 'true'
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
        run: composer i

      - name: Regenerate OpenAPI
        if: steps.check_typescript_openapi.outputs.files_exists == 'true'
        run: composer run openapi

      - name: Check openapi*.json and typescript changes
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No OpenAPI changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "OpenAPI changes detected"
          fi

      - name: Commit changes if triggered by command
        if: steps.check-changes.outputs.changed == 'true' && inputs.command != ''
        run: |
          git config --local user.email 'nextcloud-command@users.noreply.github.com'
          git config --local user.name 'nextcloud-command'
          
          git add ".${{ inputs.path }}"

      - name: Push changes if triggered by command
        if: steps.check-changes.outputs.changed == 'true' && inputs.command != ''
        env:
          # Use GITHUB_TOKEN for push - this is unprivileged for PRs
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          # Configure push URL with token
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push origin "$HEAD_REF"

      - name: Check openapi*.json and typescript changes
        if: inputs.command == ''
        run: |
          bash -c "[[ ! \"`git status --porcelain `\" ]] || (echo 'Please run \"composer run openapi\" and commit the openapi*.json files and (if applicable) src/types/openapi/openapi*.ts, see the section \"Show changes on failure\" for details' && exit 1)"

      - name: Show changes on failure
        if: failure()
        run: |
          git status
          git --no-pager diff
          exit 1 # make it red to grab attention

      - name: Add success comment if triggered by command
        if: steps.check-changes.outputs.changed == 'true' && inputs.command != '' && inputs.pr_number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt('${{ inputs.pr_number }}'),
              body: 'OpenAPI types have been regenerated and committed.'
            });
