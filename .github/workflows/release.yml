name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.0.11)'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository == 'ashcoft/nextcloud-cad-viewer'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: |
          pnpm install --frozen-lockfile
          composer install --no-dev --optimize-autoloader

      - name: Build Nextcloud App
        run: |
          pnpm build
          make appstore
        env:
          CYPRESS_INSTALL_BINARY: 0

      - name: Publish to GitHub Releases
        uses: changesets/action@v1.9.0
        with:
          version: pnpm changeset version
          commit: 'chore: version bump'
          title: 'chore: version bump'
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: success()
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="v${VERSION}"
          
          # Get previous tag for changelog
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          echo "Creating release ${TAG_NAME} from ${PREV_TAG}"
          
          # Generate release notes using GitHub CLI
          if [ -n "$PREV_TAG" ]; then
            gh release create "$TAG_NAME" \
              --title "Release ${TAG_NAME}" \
              --generate-notes \
              --repo "${{ github.repository }}"
          else
            gh release create "$TAG_NAME" \
              --title "Release ${TAG_NAME}" \
              --notes "Initial release" \
              --repo "${{ github.repository }}"
          fi
          
          # Upload app package (build output is in build/artifacts/)
          APP_FILE=$(find build/artifacts -name "*.tar.gz" ! -name "*-source.tar.gz" 2>/dev/null | head -1)
          if [ -n "$APP_FILE" ]; then
            gh release upload "$TAG_NAME" "$APP_FILE" --repo "${{ github.repository }}"
          fi
          
          # Also upload zip if exists
          APP_ZIP=$(find build/artifacts -name "*.zip" ! -name "*-source.zip" 2>/dev/null | head -1)
          if [ -n "$APP_ZIP" ]; then
            gh release upload "$TAG_NAME" "$APP_ZIP" --repo "${{ github.repository }}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}