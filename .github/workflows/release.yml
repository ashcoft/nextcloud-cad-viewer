name: Release

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  push:
    branches:
      - main
    paths:
      - '.changeset/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

  workflow_dispatch:

  tag:

  repository_dispatch:
    types:
      - release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Don't run for tag pushes - only for PRs and regular pushes with changeset changes
    if: github.repository == 'ashcoft/nextcloud-cad-viewer' && !startsWith(github.ref, 'refs/tags/')
    outputs:
      has_changesets: ${{ steps.check.outputs.has_changesets }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Check for changeset files
        id: check
        run: |
          if [ -d ".changeset" ] && [ "$(ls -A .changeset/*.md 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "has_changesets=true" >> $GITHUB_OUTPUT
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup pnpm
        if: steps.check.outputs.has_changesets == 'true'
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up node >=24
        if: steps.check.outputs.has_changesets == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.check.outputs.has_changesets == 'true'
        run: pnpm install

      - name: Create changeset PR or release
        if: steps.check.outputs.has_changesets == 'true'
        uses: changesets/action@v1
        with:
          title: 'ci: version bump'
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release_on_tag:
    name: Create Release on Tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up node >=24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Set up php 8.3
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: 8.3
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pnpm version $VERSION --no-git-tag-version --no-commit-hooks
          sed -i "s|<version>.*</version>|<version>$VERSION</version>|g" appinfo/info.xml

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: pnpm install --frozen-lockfile

      - name: Install composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Build JavaScript
        run: pnpm run build

      - name: Build Nextcloud App
        run: |
          git submodule update --init --recursive
          make production-setup
          make appstore

      - name: Package Nextcloud app
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          cd build/artifacts
          if [ -f "cad_viewer.tar.gz" ]; then
            mv cad_viewer.tar.gz "cad_viewer-${TAG_NAME}.tar.gz"
          fi
          if [ -f "cad_viewer.zip" ]; then
            mv cad_viewer.zip "cad_viewer-${TAG_NAME}.zip"
          fi

      - name: Create source archives
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          git archive --format=tar.gz -o build/artifacts/nextcloud-cad-viewer-${TAG_NAME}.tar.gz HEAD
          git archive --format=zip -o build/artifacts/nextcloud-cad-viewer-${TAG_NAME}.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@9e1d1e8e21e7a3b4e33f4e6b3c5e7c3b4d4a4e4f # v2.0.0
        with:
          files: build/artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
