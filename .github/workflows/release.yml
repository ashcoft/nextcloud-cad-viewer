name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # Build job - creates app artifacts
  build:
    name: Build App
    runs-on: ubuntu-latest
    if: github.repository == 'ashcoft/nextcloud-cad-viewer'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: pnpm install --frozen-lockfile

      - name: Check for changesets
        id: check_changesets
        run: |
          CHANGESET_FILES=$(find .changeset -maxdepth 1 -name "*.md" \( ! -name "README.md" -a ! -name "config.json" \) 2>/dev/null | wc -l)
          echo "Changeset files found: $CHANGESET_FILES"
          echo "changeset_count=$CHANGESET_FILES" >> $GITHUB_OUTPUT

      - name: Version bump
        if: steps.check_changesets.outputs.changeset_count != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          pnpm changeset version || { echo "Changeset version failed"; exit 1; }

          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

          if [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            sed -i "s|<version>[0-9.]*</version>|<version>${NEW_VERSION}</version>|g" appinfo/info.xml
            echo "Updated info.xml to version $NEW_VERSION"
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump
        if: steps.check_changesets.outputs.changeset_count != '0'
        run: |
          git add .
          git commit -m "chore: version bump

          Co-authored-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>" || exit 0

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: '8.3'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Build JavaScript
        run: pnpm run build

      - name: Build projects
        run: make production-setup

      - name: Package app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          make appstore
          if [ -f "build/artifacts/cad_viewer.tar.gz" ]; then
            mv build/artifacts/cad_viewer.tar.gz "build/artifacts/cad_viewer-${VERSION}.tar.gz"
          fi
          if [ -f "build/artifacts/cad_viewer.zip" ]; then
            mv build/artifacts/cad_viewer.zip "build/artifacts/cad_viewer-${VERSION}.zip"
          fi
          echo "=== Artifacts ==="
          ls -la build/artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-${{ github.run_id }}
          path: build/artifacts/
          retention-days: 1

  # Publish release job - downloads artifacts and creates release
  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: github.repository == 'ashcoft/nextcloud-cad-viewer'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-artifacts-${{ github.run_id }}
          path: build/artifacts/

      - name: Create release
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TAG_NAME="v${VERSION}"

          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME"

            CHANGELOG="## What's Changed\nThis release includes changes from changesets."

            UPLOAD_URL=$(curl -s -X POST "https://api.github.com/repos/${{ github.repository }}/releases" \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\": \"$TAG_NAME\", \"name\": \"Release $TAG_NAME\", \"body\": \"$CHANGELOG\", \"draft\": false, \"prerelease\": false}" | jq -r '.upload_url' | sed 's/{?name,label}//')

            echo "Release created at: $UPLOAD_URL"

            if [ -f "build/artifacts/cad_viewer-${VERSION}.tar.gz" ]; then
              curl -s -X POST "${UPLOAD_URL}?name=cad_viewer-${VERSION}.tar.gz" \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Content-Type: application/x-gzip" \
                --data-binary "@build/artifacts/cad_viewer-${VERSION}.tar.gz"
              echo "Attached tar.gz"
            fi

            if [ -f "build/artifacts/cad_viewer-${VERSION}.zip" ]; then
              curl -s -X POST "${UPLOAD_URL}?name=cad_viewer-${VERSION}.zip" \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Content-Type: application/zip" \
                --data-binary "@build/artifacts/cad_viewer-${VERSION}.zip"
              echo "Attached zip"
            fi
          fi

      - name: Push changes
        run: git push origin main || exit 0

      - name: Clean up changesets
        run: |
          find .changeset -maxdepth 1 -name "*.md" \( ! -name "README.md" -a ! -name "config.json" \) -exec rm {} \;
          git add .
          git commit -m "chore: remove processed changeset files

          Co-authored-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>" || exit 0
          git push origin main || exit 0
