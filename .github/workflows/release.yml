name: Release

on:
  push:
    branches:
      - main
      - stable
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no release)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  APP_NAME: cad_viewer

jobs:
  build:
    name: Build Nextcloud App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          composer install --no-dev --optimize-autoloader

      - name: Build Nextcloud App
        run: |
          pnpm run build
          make production-setup

      - name: Ensure zip available
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y zip
          fi

      - name: Build app archive
        run: |
          make appstore
          echo "=== Built Artifacts ==="
          ls -la build/artifacts/

      - name: Set ownership for artifacts
        run: |
          sudo chown -R www-data:www-data build/artifacts/
          echo "=== Artifacts ownership ==="
          ls -la build/artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.APP_NAME }}-build
          path: |
            build/artifacts/*.tar.gz
            build/artifacts/*.zip
          retention-days: 1
          compression-level: 6
          overwrite: true

  release:
    name: Release & Publish
    runs-on: ubuntu-latest
    needs: build
    if: github.repository_owner == 'ashcoft'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.semantic.outputs.version }}
      tag_name: ${{ steps.semantic.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.APP_NAME }}-build
          path: build/artifacts

      - name: Verify artifacts exist
        run: |
          echo "=== Artifacts ==="
          ls -la build/artifacts/

      - name: Semantic Release
        id: semantic
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npx semantic-release --dry-run
          else
            npx semantic-release
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          DRY_RUN: ${{ github.event.inputs.dry_run }}

      - name: Upload artifacts to release (fallback)
        if: steps.semantic.outputs.version != ''
        run: |
          TAG="v${{ steps.semantic.outputs.version }}"
          echo "Uploading release assets for: $TAG"

          for FILE in \
            "build/artifacts/${APP_NAME}.tar.gz" \
            "build/artifacts/${APP_NAME}.zip"; do
            if [ -f "$FILE" ]; then
              gh release upload "$TAG" "$FILE" --clobber
              echo "Uploaded: $FILE"
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
