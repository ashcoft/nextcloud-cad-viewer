name: Release

on:
  push:
    branches:
      - main
      - 'release-please--branches--*--components--*'
  workflow_dispatch:
    inputs:
      skip_release:
        description: 'Skip release creation (build artifacts only)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  APP_NAME: cad_viewer

jobs:
  release:
    name: Release & Build
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ashcoft'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Check if release mode
        id: release_check
        run: |
          IS_RELEASE=true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_release }}" = "true" ]; then
            IS_RELEASE=false
            echo "Running in build-only mode (no release)"
          fi
          echo "is_release=${IS_RELEASE}" >> $GITHUB_OUTPUT

      - name: Release Please
        if: steps.release_check.outputs.is_release == 'true'
        id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: node
          target-branch: main
          config-file: release-please-config.json

      - name: Get version
        id: version
        run: |
          # Read version from manifest (updated by release-please)
          if [ -f ".release-please-manifest.json" ]; then
            VERSION=$(node -p "require('./.release-please-manifest.json')['.']")
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          composer install --no-dev --optimize-autoloader

      - name: Build Nextcloud App
        run: |
          pnpm run build
          make production-setup

      - name: Ensure zip available
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y zip
          fi

      - name: Build app archive
        run: |
          make appstore
          echo "=== Built Artifacts ==="
          ls -la build/artifacts/

      - name: Upload artifacts to release
        if: steps.release_check.outputs.is_release == 'true'
        run: |
          TAG=${{ steps.version.outputs.tag }}
          echo "Uploading release assets for: $TAG"

          # Wait for release to be created by release-please
          for i in {1..30}; do
            if gh release view "$TAG" &>/dev/null; then
              echo "Release $TAG is available"
              break
            fi
            echo "Waiting for release... ($i/30)"
            sleep 2
          done

          echo "=== Uploading artifacts ==="
          for FILE in \
            "build/artifacts/${APP_NAME}.tar.gz" \
            "build/artifacts/${APP_NAME}.zip"; do
            if [ -f "$FILE" ]; then
              echo "Uploading: $FILE"
              gh release upload "$TAG" "$FILE" --clobber
            fi
          done

          echo "=== Release assets ==="
          gh release view "$TAG" --json assets -q '.assets[].name'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts (CI)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}
          path: |
            build/artifacts/*.tar.gz
            build/artifacts/*.zip
          retention-days: 90
          compression-level: 6
          overwrite: true
