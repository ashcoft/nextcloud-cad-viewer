name: Release

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (not recommended)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  # Quality check - ensure tests pass before release
  quality:
    name: Quality Check
    runs-on: ubuntu-latest
    if: github.repository == 'ashcoft/nextcloud-cad-viewer'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: pnpm install --frozen-lockfile

      - name: Check for changesets
        id: check_changesets
        run: |
          CHANGESET_FILES=$(find .changeset -maxdepth 1 -name "*.md" \( ! -name "README.md" -a ! -name "config.json" \) 2>/dev/null | wc -l)
          echo "Changeset files found: $CHANGESET_FILES"
          echo "changeset_count=$CHANGESET_FILES" >> $GITHUB_OUTPUT

      - name: Get version
        id: get_version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Run tests
        if: ${{ !inputs.skip_tests }}
        run: pnpm run test

      - name: Type check
        if: ${{ !inputs.skip_tests }}
        run: pnpm run check-types

      - name: Lint
        if: ${{ !inputs.skip_tests }}
        run: pnpm run lint

  # Build job - creates app artifacts
  build:
    name: Build App
    runs-on: ubuntu-latest
    needs: quality
    if: github.repository == 'ashcoft/nextcloud-cad-viewer' && needs.quality.outputs.changeset_count != '0'
    outputs:
      version: ${{ steps.version.outputs.version }}
      has_changeset: ${{ needs.quality.outputs.changeset_count != '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Version bump with changesets
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          pnpm changeset version || { echo "Changeset version failed"; exit 1; }

          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

          if [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            sed -i "s|<version>[0-9.]*</version>|<version>${NEW_VERSION}</version>|g" appinfo/info.xml
            echo "Updated info.xml to version $NEW_VERSION"
          fi

      - name: Commit version bump
        run: |
          git add .
          git commit -m "chore: version bump

          Co-authored-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>" || exit 0

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: '8.3'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Build JavaScript
        run: pnpm run build

      - name: Build projects
        run: make production-setup

      - name: Package app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          make appstore
          if [ -f "build/artifacts/cad_viewer.tar.gz" ]; then
            mv build/artifacts/cad_viewer.tar.gz "build/artifacts/cad_viewer-${VERSION}.tar.gz"
          fi
          if [ -f "build/artifacts/cad_viewer.zip" ]; then
            mv build/artifacts/cad_viewer.zip "build/artifacts/cad_viewer-${VERSION}.zip"
          fi
          echo "=== Artifacts ==="
          ls -la build/artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts-${{ github.run_id }}
          path: build/artifacts/
          retention-days: 1

  # Publish release job - downloads artifacts and creates release
  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: github.repository == 'ashcoft/nextcloud-cad-viewer' && needs.build.outputs.has_changeset == 'true'
    environment:
      name: release
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download artifacts
        uses: actions/download-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts-${{ github.run_id }}
          path: build/artifacts/

      - name: Generate changelog
        id: changelog
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${VERSION}"

          # Get the previous tag for comparison
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          # Generate changelog using changesets
          CHANGELOG=$(pnpm changeset log --empty --since="${PREV_TAG:-HEAD~1}" 2>/dev/null || echo "")

          # If changeset log is empty, try a different approach
          if [ -z "$CHANGELOG" ]; then
            # Get all commits since last tag
            if [ -n "$PREV_TAG" ]; then
              CHANGELOG=$(git log --no-merges --format="- %s by @%an" ${PREV_TAG}..HEAD 2>/dev/null || echo "No changes documented")
            else
              CHANGELOG="Initial release"
            fi
          fi

          # Format the release body
          RELEASE_BODY="## What's Changed

${CHANGELOG}

---

*This release was generated by changesets*"

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release
        id: release
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TAG_NAME="v${VERSION}"

          # Check if tag already exists
          if ! git revparse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Creating tag: $TAG_NAME"
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME"
          else
            echo "Tag $TAG_NAME already exists"
          fi

      - name: Upload release assets via GitHub CLI
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${VERSION}"

          # Get the release by tag
          RELEASE_ID=$(gh release view "$TAG_NAME" --json id -q .id 2>/dev/null || echo "")

          if [ -z "$RELEASE_ID" ]; then
            echo "Creating release with gh..."
            BODY_FILE=$(mktemp)
            echo "${{ needs.build.outputs.changelog }}" > "$BODY_FILE"

            gh release create "$TAG_NAME" \
              --title "Release $TAG_NAME" \
              --notes-file "$BODY_FILE" \
              --target main \
              build/artifacts/cad_viewer-${VERSION}.tar.gz \
              build/artifacts/cad_viewer-${VERSION}.zip
          else
            echo "Release exists, uploading assets..."
            gh release upload "$TAG_NAME" \
              build/artifacts/cad_viewer-${VERSION}.tar.gz \
              build/artifacts/cad_viewer-${VERSION}.zip \
              --clobber
          fi

          echo "=== Release Assets ==="
          gh release view "$TAG_NAME" --json assets -q '.assets[] | "\(.name): \(.browserDownloadUrl)"'

      - name: Clean up changesets
        run: |
          find .changeset -maxdepth 1 -name "*.md" \( ! -name "README.md" -a ! -name "config.json" \) -exec rm {} \;
          git add .
          git commit -m "chore: remove processed changeset files

          Co-authored-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>" || exit 0
          git push origin main || exit 0
