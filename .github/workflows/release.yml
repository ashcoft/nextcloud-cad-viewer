name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  APP_NAME: cad_viewer

jobs:
  release:
    name: Create Release PR
    runs-on: ubuntu-latest
    if: github.repository == 'ashcoft/nextcloud-cad-viewer'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Get PHP version from composer.json
        id: php-version
        run: |
          PHP_VERSION=$(grep -oP '"php": "\K[^"]+' composer.json | head -1)
          echo "version=$PHP_VERSION" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ steps.php-version.outputs.version }}
          coverage: none

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: |
          pnpm install --frozen-lockfile
          composer install --no-dev --optimize-autoloader

      - name: Get current version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create changeset PR
        id: changeset
        uses: changesets/action@v1.9.0
        with:
          version: pnpm changeset version
          commit: 'chore: version bump'
          title: 'chore: version bump'
          createGithubReleases: true
          publish: echo "Skipping npm publish"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update lockfile after version bump
        if: github.event.head_commit.message == 'chore: version bump'
        run: pnpm install --frozen-lockfile

      - name: Sync version to info.xml
        if: github.event.head_commit.message == 'chore: version bump'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/<version>[0-9.]*<\/version>/<version>${VERSION}<\/version>/" appinfo/info.xml
          git add appinfo/info.xml pnpm-lock.yaml
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore: sync version to info.xml and update lockfile"
          git push

      - name: Build Nextcloud App
        if: github.event.head_commit.message == 'chore: version bump'
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: |
          pnpm run build
          make production-setup
          make appstore

      - name: Upload release assets
        if: github.event.head_commit.message == 'chore: version bump'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          
          # Upload tar.gz
          TARBALL=$(find build/artifacts -name "*.tar.gz" ! -name "*-source.tar.gz" | head -1)
          if [ -n "$TARBALL" ]; then
            gh release upload "v${VERSION}" "$TARBALL" --repo "${{ github.repository }}"
          fi
          
          # Upload zip
          ZIPFILE=$(find build/artifacts -name "*.zip" ! -name "*-source.zip" | head -1)
          if [ -n "$ZIPFILE" ]; then
            gh release upload "v${VERSION}" "$ZIPFILE" --repo "${{ github.repository }}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}