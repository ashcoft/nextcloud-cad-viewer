name: Release

on:
  push:
    branches:
      - main
      - stable
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no release)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  APP_NAME: cad_viewer

jobs:
  # Determine the next version and let semantic-release bump appinfo/info.xml
  # and package.json, commit them and create the tag.
  #
  # This runs BEFORE the build so the archives are packaged from the released
  # version. Building first produced archives whose appinfo/info.xml still
  # carried the previous tag's version.
  release:
    name: Release & Publish
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ashcoft'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      published: ${{ steps.semantic.outputs.published }}
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # semantic-release pushes the release commit and tag with the token
          # from its own step, so the checkout does not need to persist it.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install dependencies
        # semantic-release needs no build; skip install lifecycle scripts.
        # (semantic-release plugins still run in-process with GITHUB_TOKEN.)
        run: pnpm install --ignore-scripts

      - name: Semantic Release
        id: semantic
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npx semantic-release --dry-run
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE_SHA=$(git rev-parse HEAD)
          npx semantic-release
          AFTER_SHA=$(git rev-parse HEAD)

          # Read the tag semantic-release created on this commit rather than
          # comparing globally newest tags: a release on one branch can be
          # lower than an existing tag on another.
          VERSION=$(git tag --points-at HEAD --sort=-v:refname | head -n1)
          if [ -n "$VERSION" ] && [ "$AFTER_SHA" != "$BEFORE_SHA" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          DRY_RUN: ${{ github.event.inputs.dry_run }}

  # Build the app archive from the released version and attach it to the tag.
  build:
    name: Build Nextcloud App
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: write
    steps:
      # Check out the release tag so appinfo/info.xml matches the version.
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}
          # No credential is needed to build; keep the token out of git config
          # so dependency install scripts cannot read it.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.4'
          coverage: none

      - name: Verify the released version in appinfo/info.xml
        env:
          EXPECTED: ${{ needs.release.outputs.version }}
        run: |
          ACTUAL=$(sed -n 's/.*<version>\(.*\)<\/version>.*/\1/p' appinfo/info.xml | head -n 1 | xargs)
          echo "info.xml version: $ACTUAL (expected $EXPECTED)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::appinfo/info.xml version ($ACTUAL) does not match the release ($EXPECTED)"
            exit 1
          fi

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          composer install --no-dev --optimize-autoloader

      - name: Build Nextcloud App
        run: make production-setup

      - name: Ensure zip available
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y zip
          fi

      - name: Build app archive
        run: |
          make appstore
          echo "=== Built Artifacts ==="
          ls -la build/artifacts/

      - name: Verify the archive version matches the release
        env:
          EXPECTED: ${{ needs.release.outputs.version }}
        run: |
          ACTUAL=$(tar -xzf build/artifacts/${APP_NAME}.tar.gz -O ${APP_NAME}/appinfo/info.xml \
            | sed -n 's/.*<version>\(.*\)<\/version>.*/\1/p' | head -n 1 | xargs)
          echo "archive info.xml version: $ACTUAL (expected $EXPECTED)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Archive version ($ACTUAL) does not match the release ($EXPECTED)"
            exit 1
          fi

      - name: Upload artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.release.outputs.version }}"
          echo "Uploading release assets for: $TAG"

          for FILE in \
            "build/artifacts/${APP_NAME}.tar.gz" \
            "build/artifacts/${APP_NAME}.zip"; do
            if [ -f "$FILE" ]; then
              gh release upload "$TAG" "$FILE" --clobber
              echo "Uploaded: $FILE"
            fi
          done

          # Publish the draft only now that the archives are attached, so a
          # release never goes public without its assets.
          gh release edit "$TAG" --draft=false
          echo "Published release $TAG"
