name: release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for manual release (e.g., 0.0.2, overrides changeset)'
        required: false
        type: string
      skip_build:
        description: 'Skip build (only tag and release)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  changeset-version:
    name: Changeset Versioning
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "^24"
          cache: 'pnpm'

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create version PR
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          commit: "chore: version bump"
          title: "chore: version bump"
          setupGitHubUser: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: changeset-version
    outputs:
      tag_name: ${{ steps.set-tag.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Read tag from version
        id: set-tag
        run: |
          # Get the latest tag matching the package name pattern
          git fetch --tags
          TAG=$(git describe --tags --abbrev=0 2>/dev/null | grep -oP 'nextcloud-cad-viewer-v\K[0-9.]+' || echo "")
          if [ -z "$TAG" ]; then
            # Fallback: use package.json version
            TAG=$(node -p "require('./package.json').version")
          fi
          # For GitHub Release tag
          TAG_NAME="nextcloud-cad-viewer-v${TAG}"
          # For artifact filenames (simpler)
          ARTIFACT_TAG="cad_viewer-v${TAG}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "artifact_tag=$ARTIFACT_TAG" >> $GITHUB_OUTPUT
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Read package.json node and npm engines version
        uses: skjnldsv/read-package-engines-version-actions@06d6baf7d8f41934ab630e97d9e6c0bc9c9ac5e4 # v3
        id: versions
        continue-on-error: true
        with:
          fallbackNode: '^24'
          fallbackPnpm: '^10'

      - name: Setup pnpm
        if: ${{ steps.versions.outputs.nodeVersion }}
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up node ${{ steps.versions.outputs.nodeVersion }}
        if: ${{ steps.versions.outputs.nodeVersion }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}
          cache: 'pnpm'

      - name: Set up php 8.3
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: 8.3
          coverage: none

      - name: Install pnpm dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: pnpm install --frozen-lockfile

      - name: Update info.xml version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/<version>.*<\/version>/<version>$VERSION<\/version>/" appinfo/info.xml

      - name: Install composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Build JavaScript
        run: pnpm run build

      - name: Build projects
        run: make production-setup

      - name: Package Nextcloud app with makefile
        run: |
          make appstore
          cd build/artifacts
          for f in *.tar.gz *.zip; do
            if [ -f "$f" ]; then
              if [[ "$f" == *.tar.gz ]]; then
                mv "$f" "cad_viewer-${{ steps.set-tag.outputs.artifact_tag }}.tar.gz"
              else
                mv "$f" "cad_viewer-${{ steps.set-tag.outputs.artifact_tag }}.zip"
              fi
            fi
          done

      - name: Verify app artifacts
        run: ls -lah build/artifacts/

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: cad_viewer-${{ steps.set-tag.outputs.artifact_tag }}
          path: |
            build/artifacts/cad_viewer-${{ steps.set-tag.outputs.artifact_tag }}.tar.gz
            build/artifacts/cad_viewer-${{ steps.set-tag.outputs.artifact_tag }}.zip

      - name: Create source archives
        run: |
          cd ${{ github.workspace }}
          git archive --format=tar.gz -o build/artifacts/nextcloud-cad-viewer-${{ steps.set-tag.outputs.artifact_tag }}.tar.gz HEAD
          git archive --format=zip -o build/artifacts/nextcloud-cad-viewer-${{ steps.set-tag.outputs.artifact_tag }}.zip HEAD

      - name: Upload source artifacts
        uses: actions/upload-artifact@v7
        with:
          name: source-${{ steps.set-tag.outputs.artifact_tag }}
          path: |
            build/artifacts/nextcloud-cad-viewer-${{ steps.set-tag.outputs.artifact_tag }}.tar.gz
            build/artifacts/nextcloud-cad-viewer-${{ steps.set-tag.outputs.artifact_tag }}.zip

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download app artifacts
        uses: actions/download-artifact@v8
        with:
          name: cad_viewer-${{ needs.build.outputs.artifact_tag }}
          path: build/artifacts/

      - name: Download source artifacts
        uses: actions/download-artifact@v8
        with:
          name: source-${{ needs.build.outputs.artifact_tag }}
          path: build/artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ needs.build.outputs.tag_name }}
          generate_release_notes: true
          files: |
            build/artifacts/cad_viewer-${{ needs.build.outputs.artifact_tag }}.tar.gz
            build/artifacts/cad_viewer-${{ needs.build.outputs.artifact_tag }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete automatic source code archives
        if: github.event_name != 'workflow_dispatch'
        run: |
          # Get the release ID
          RELEASE_ID=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ needs.build.outputs.tag_name }}" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          # Get assets for this release
          cat << 'PYEOF' > /tmp/delete_assets.py
          import sys,json
          import urllib.request
          assets = json.load(sys.stdin)
          for asset in assets:
              if asset['name'] in ['Source code.tar.gz', 'Source code.zip']:
                  print(f"Deleting {asset['name']} (ID: {asset['id']})")
                  req = urllib.request.Request(
                      f"https://api.github.com/repos/${{ github.repository }}/releases/assets/{asset['id']}",
                      method='DELETE',
                      headers={'Authorization': 'token ${{ secrets.GITHUB_TOKEN }}'}
                  )
                  urllib.request.urlopen(req)
          PYEOF
          curl -s "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" | python3 /tmp/delete_assets.py

  manual-release:
    name: Manual Release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      tag_name: ${{ steps.set-tag.outputs.tag_name }}
      artifact_tag: ${{ steps.set-tag.outputs.artifact_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Determine tag name
        id: set-tag
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            TAG_NAME="nextcloud-cad-viewer-v${{ github.event.inputs.version }}"
            ARTIFACT_TAG="cad_viewer-v${{ github.event.inputs.version }}"
          else
            TAG_NAME="${GITHUB_REF##*/}"
            ARTIFACT_TAG="cad_viewer-$(echo "$TAG_NAME" | sed 's/nextcloud-cad-viewer-//')"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "artifact_tag=$ARTIFACT_TAG" >> $GITHUB_OUTPUT

      - name: Read package.json node and npm engines version
        uses: skjnldsv/read-package-engines-version-actions@06d6baf7d8f41934ab630e97d9e6c0bc9c9ac5e4 # v3
        id: versions
        continue-on-error: true
        with:
          fallbackNode: '^24'
          fallbackPnpm: '^10'

      - name: Setup pnpm
        if: ${{ steps.versions.outputs.nodeVersion }}
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up node ${{ steps.versions.outputs.nodeVersion }}
        if: ${{ steps.versions.outputs.nodeVersion }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}
          cache: 'pnpm'

      - name: Set up php 8.3
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: 8.3
          coverage: none

      - name: Install pnpm dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: pnpm install --frozen-lockfile

      - name: Install composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Update version
        if: ${{ github.event.inputs.version && github.event.inputs.skip_build != 'true' }}
        run: |
          pnpm version ${{ github.event.inputs.version }} --no-git-tag-version
          sed -i 's/<version>.*<\/version>/<version>${{ github.event.inputs.version }}<\/version>/' appinfo/info.xml

      - name: Build JavaScript
        if: ${{ github.event.inputs.skip_build != 'true' }}
        run: pnpm run build

      - name: Build projects
        if: ${{ github.event.inputs.skip_build != 'true' }}
        run: make production-setup

      - name: Package Nextcloud app with makefile
        if: ${{ github.event.inputs.skip_build != 'true' }}
        run: |
          make appstore
          cd build/artifacts
          for f in *.tar.gz *.zip; do
            if [ -f "$f" ]; then
              if [[ "$f" == *.tar.gz ]]; then
                mv "$f" "cad_viewer-${{ steps.set-tag.outputs.artifact_tag }}.tar.gz"
              else
                mv "$f" "cad_viewer-${{ steps.set-tag.outputs.artifact_tag }}.zip"
              fi
            fi
          done

      - name: Verify app artifacts
        if: ${{ github.event.inputs.skip_build != 'true' }}
        run: ls -lah build/artifacts/

      - name: Upload Artifact
        if: ${{ github.event.inputs.skip_build != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: cad_viewer-${{ steps.set-tag.outputs.artifact_tag }}
          path: |
            build/artifacts/cad_viewer-${{ steps.set-tag.outputs.artifact_tag }}.tar.gz
            build/artifacts/cad_viewer-${{ steps.set-tag.outputs.artifact_tag }}.zip

      - name: Create source archives
        run: |
          cd ${{ github.workspace }}
          git archive --format=tar.gz -o build/artifacts/nextcloud-cad-viewer-${{ steps.set-tag.outputs.artifact_tag }}.tar.gz HEAD
          git archive --format=zip -o build/artifacts/nextcloud-cad-viewer-${{ steps.set-tag.outputs.artifact_tag }}.zip HEAD

      - name: Upload source artifacts
        uses: actions/upload-artifact@v7
        with:
          name: source-${{ steps.set-tag.outputs.artifact_tag }}
          path: |
            build/artifacts/nextcloud-cad-viewer-${{ steps.set-tag.outputs.artifact_tag }}.tar.gz
            build/artifacts/nextcloud-cad-viewer-${{ steps.set-tag.outputs.artifact_tag }}.zip

  manual-release-publish:
    name: Publish Manual Release
    runs-on: ubuntu-latest
    needs: manual-release
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Download app artifacts
        uses: actions/download-artifact@v8
        with:
          name: cad_viewer-${{ needs.manual-release.outputs.artifact_tag }}
          path: build/artifacts/

      - name: Download source artifacts
        uses: actions/download-artifact@v8
        with:
          name: source-${{ needs.manual-release.outputs.artifact_tag }}
          path: build/artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ needs.manual-release.outputs.tag_name }}
          generate_release_notes: true
          files: |
            build/artifacts/cad_viewer-${{ needs.manual-release.outputs.artifact_tag }}.tar.gz
            build/artifacts/cad_viewer-${{ needs.manual-release.outputs.artifact_tag }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete automatic source code archives
        run: |
          # Get the release ID
          RELEASE_ID=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ needs.manual-release.outputs.tag_name }}" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          # Get assets for this release
          cat << 'PYEOF' > /tmp/delete_assets.py
          import sys,json
          import urllib.request
          assets = json.load(sys.stdin)
          for asset in assets:
              if asset['name'] in ['Source code.tar.gz', 'Source code.zip']:
                  print(f"Deleting {asset['name']} (ID: {asset['id']})")
                  req = urllib.request.Request(
                      f"https://api.github.com/repos/${{ github.repository }}/releases/assets/{asset['id']}",
                      method='DELETE',
                      headers={'Authorization': 'token ${{ secrets.GITHUB_TOKEN }}'}
                  )
                  urllib.request.urlopen(req)
          PYEOF
          curl -s "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" | python3 /tmp/delete_assets.py

