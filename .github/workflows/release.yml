name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_release:
        description: 'Skip release creation (build artifacts only)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  APP_NAME: cad_viewer

jobs:
  release:
    name: Release & Build
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ashcoft'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      is_release: ${{ steps.release_check.outputs.is_release }}
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Current version: ${VERSION}"

      - name: Check if release mode
        id: release_check
        run: |
          IS_RELEASE=true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_release }}" = "true" ]; then
            IS_RELEASE=false
            echo "Running in build-only mode (no release)"
          fi
          echo "is_release=${IS_RELEASE}" >> $GITHUB_OUTPUT

      - name: Release Please
        if: steps.release_check.outputs.is_release == 'true'
        id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: node
          package-name: nextcloud-cad-viewer
          monorepo-tags: false
          default-branch: main
          changelog-types: |
            [{"type":"feat","section":"Features","hidden":false},{"type":"fix","section":"Bug Fixes","hidden":false},{"type":"chore","section":"Maintenance","hidden":false},{"type":"docs","section":"Documentation","hidden":false},{"type":"refactor","section":"Refactoring","hidden":false},{"type":"perf","section":"Performance","hidden":false},{"type":"test","section":"Testing","hidden":false},{"type":"ci","section":"CI/CD","hidden":false},{"type":"build","section":"Build System","hidden":false},{"type":"deps","section":"Dependencies","hidden":false},{"type":"security","section":"Security","hidden":true}]

      - name: Setup Git config
        if: steps.release_check.outputs.is_release == 'true' && steps.release-please.outputs.release_created == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Update version files
        if: steps.release_check.outputs.is_release == 'true' && steps.release-please.outputs.release_created == 'true'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo "Updating version to ${VERSION}..."

          # Update appinfo/info.xml
          sed -i "s|<version>[^<]*</version>|<version>${VERSION}</version>|" appinfo/info.xml

          # Update package.json
          node -e "
            const pkg = require('./package.json');
            pkg.version = '${VERSION}';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # Update pnpm-lock.yaml
          pnpm install --lockfile-only --ignore-scripts

          # Update .release-please-manifest.json
          echo "{\"nextcloud-cad-viewer\": \"${VERSION}\"}" > .release-please-manifest.json

          echo "=== Updated files ==="
          git diff --stat

      - name: Commit and push version updates
        if: steps.release_check.outputs.is_release == 'true' && steps.release-please.outputs.release_created == 'true'
        run: |
          TAG=${{ steps.version.outputs.tag }}
          if git diff --quiet; then
            echo "No changes to commit"
          else
            echo "Committing version updates..."
            git add appinfo/info.xml package.json pnpm-lock.yaml .release-please-manifest.json README.md
            git commit -m "chore(release): update version to ${TAG}"
            git tag -a ${TAG} -m "${TAG}" || true
            git push origin main
            git push origin ${TAG} || true
          fi

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          composer install --no-dev --optimize-autoloader

      - name: Build Nextcloud App
        run: |
          pnpm run build
          make production-setup

      - name: Ensure zip available
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y zip
          fi

      - name: Build app archive
        run: |
          make appstore
          echo "=== Built Artifacts ==="
          ls -la build/artifacts/

      - name: Upload Nextcloud app to release
        if: steps.release_check.outputs.is_release == 'true' && steps.release-please.outputs.release_created == 'true'
        run: |
          TAG=${{ steps.version.outputs.tag }}
          echo "Uploading Nextcloud app archive for release: $TAG"

          # Upload tar.gz (Nextcloud app archive - required)
          TARBALL="build/artifacts/${APP_NAME}.tar.gz"
          if [ -f "$TARBALL" ]; then
            gh release upload "$TAG" "$TARBALL" --clobber
            echo "Uploaded: $TARBALL"
          else
            echo "ERROR: $TARBALL not found"
            exit 1
          fi

          # Upload zip (Nextcloud app archive - optional)
          ZIPFILE="build/artifacts/${APP_NAME}.zip"
          if [ -f "$ZIPFILE" ]; then
            gh release upload "$TAG" "$ZIPFILE" --clobber
            echo "Uploaded: $ZIPFILE"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload source code archive
        if: steps.release_check.outputs.is_release == 'true' && steps.release-please.outputs.release_created == 'true'
        run: |
          TAG=${{ steps.version.outputs.tag }}
          echo "Creating source archive for release: $TAG"

          # Create source archive
          mkdir -p build/artifacts
          git archive --format=tar.gz --prefix=${APP_NAME}/ -o build/artifacts/${APP_NAME}-source.tar.gz HEAD
          git archive --format=zip --prefix=${APP_NAME}/ -o build/artifacts/${APP_NAME}-source.zip HEAD

          # Upload source archives
          gh release upload "$TAG" build/artifacts/${APP_NAME}-source.tar.gz --clobber
          gh release upload "$TAG" build/artifacts/${APP_NAME}-source.zip --clobber
          echo "Uploaded source archives"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts (CI)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}
          path: |
            build/artifacts/*.tar.gz
            build/artifacts/*.zip
          retention-days: 90
          compression-level: 6
          overwrite: true
