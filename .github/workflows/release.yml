name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_release:
        description: 'Skip release creation (build artifacts only)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  APP_NAME: cad_viewer

jobs:
  release:
    name: Release & Build
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ashcoft'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      is_release: ${{ steps.release_check.outputs.is_release }}
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Current version: ${VERSION}"

      - name: Check if release mode
        id: release_check
        run: |
          IS_RELEASE=true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_release }}" = "true" ]; then
            IS_RELEASE=false
            echo "Running in build-only mode (no release)"
          fi
          echo "is_release=${IS_RELEASE}" >> $GITHUB_OUTPUT

      - name: Release Please
        if: steps.release_check.outputs.is_release == 'true'
        id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: node
          target-branch: main

      # Single source of truth for "are we actually publishing a release right now?"
      - name: Compute release gate
        id: gate
        run: |
          DO_RELEASE=false
          if [ "${{ steps.release_check.outputs.is_release }}" = "true" ] && \
             [ "${{ steps.release-please.outputs.release_created }}" = "true" ]; then
            DO_RELEASE=true
          fi
          echo "do_release=${DO_RELEASE}" >> $GITHUB_OUTPUT

      - name: Verify versions are synchronized
        run: |
          VERSION=${{ steps.version.outputs.version }}
          INFO_VERSION=$(grep -oP '(?<=<version>)[^<]+' appinfo/info.xml)
          echo "package.json version: ${VERSION}"
          echo "info.xml version: ${INFO_VERSION}"
          
          if [ "$VERSION" != "$INFO_VERSION" ]; then
            echo "ERROR: info.xml version does not match package.json!"
            echo "Expected: ${VERSION}, Found: ${INFO_VERSION}"
            exit 1
          fi
          echo "✓ Versions are synchronized!"

      - name: Create release tag
        if: steps.gate.outputs.do_release == 'true'
        run: |
          TAG=${{ steps.version.outputs.tag }}
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists"
          else
            echo "Creating tag ${TAG}"
            git tag -a ${TAG} -m "${TAG}"
            git push origin ${TAG}
          fi

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          composer install --no-dev --optimize-autoloader

      - name: Build Nextcloud App
        run: |
          pnpm run build
          make production-setup

      - name: Ensure zip available
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y zip
          fi

      - name: Build app archive
        run: |
          make appstore
          echo "=== Built Artifacts ==="
          ls -la build/artifacts/

      - name: Create source archives
        if: steps.gate.outputs.do_release == 'true'
        run: |
          mkdir -p build/artifacts
          git archive --format=tar.gz --prefix=${APP_NAME}/ -o build/artifacts/${APP_NAME}-source.tar.gz HEAD
          git archive --format=zip --prefix=${APP_NAME}/ -o build/artifacts/${APP_NAME}-source.zip HEAD

      - name: Upload artifacts to release
        if: steps.gate.outputs.do_release == 'true'
        run: |
          TAG=${{ steps.version.outputs.tag }}
          echo "Uploading release assets for: $TAG"

          TARBALL="build/artifacts/${APP_NAME}.tar.gz"
          if [ ! -f "$TARBALL" ]; then
            echo "ERROR: $TARBALL not found"
            exit 1
          fi

          for FILE in \
            "build/artifacts/${APP_NAME}.tar.gz" \
            "build/artifacts/${APP_NAME}.zip" \
            "build/artifacts/${APP_NAME}-source.tar.gz" \
            "build/artifacts/${APP_NAME}-source.zip"; do
            if [ -f "$FILE" ]; then
              gh release upload "$TAG" "$FILE" --clobber
              echo "Uploaded: $FILE"
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts (CI)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}
          path: |
            build/artifacts/*.tar.gz
            build/artifacts/*.zip
          retention-days: 90
          compression-level: 6
          overwrite: true
