name: Release

on:
  push:
    branches:
      - main
    paths:
      - '.changeset/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

  workflow_dispatch:

  repository_dispatch:
    types:
      - release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository == 'ashcoft/nextcloud-cad-viewer'
    outputs:
      has_changesets: ${{ steps.check-changesets.outputs.has_changesets }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Check for changeset files
        id: check-changesets
        run: |
          CHANGESET_COUNT=$(find .changeset -name "*.md" -type f 2>/dev/null | wc -l)
          echo "Found $CHANGESET_COUNT changeset files"
          if [ "$CHANGESET_COUNT" -gt 0 ]; then
            echo "has_changesets=true" >> $GITHUB_OUTPUT
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
            echo "No changesets found - skipping release"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        if: steps.check-changesets.outputs.has_changesets == 'true'

      - name: Set up node >=24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'
        if: steps.check-changesets.outputs.has_changesets == 'true'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        if: steps.check-changesets.outputs.has_changesets == 'true'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
        if: steps.check-changesets.outputs.has_changesets == 'true'

      - name: Run changesets
        uses: changesets/action@v1
        if: steps.check-changesets.outputs.has_changesets == 'true'
        with:
          title: 'chore: version bump'
          commit-message: 'chore: version bump'
          version: |
            pnpm changeset version
            VERSION=$(node -p "require('./package.json').version")
            sed -i "s|<version>[0-9.]*</version>|<version>${VERSION}</version>|g" appinfo/info.xml
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Manual version bump
        if: github.event_name == 'workflow_dispatch' && steps.check-changesets.outputs.has_changesets == 'false'
        run: |
          echo "Manual release triggered without changesets - bumping patch version"
          pnpm version patch --no-git-tag-version --no-commit-hooks || true
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s|<version>[0-9.]*</version>|<version>${VERSION}</version>|g" appinfo/info.xml
          echo "Version bumped to $VERSION"

      - name: Create version bump PR
        if: github.event_name == 'workflow_dispatch' && steps.check-changesets.outputs.has_changesets == 'false'
        uses: peter-evans/create-pull-request@7c6a503a2c8b6f7e8c9e0b3a8e5c5c5d8e9f0a1b # v7.0.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: version bump'
          title: 'chore: version bump'
          body: |
            ## Summary
            Manual version bump created by workflow_dispatch.
          branch: version-bump
          delete-branch: true
          labels: release
