name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  APP_NAME: cad_viewer
  APP_ID: cad_viewer

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: github.repository == 'ashcoft/nextcloud-cad-viewer'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT

      - name: Read package.json node and pnpm engines version
        uses: skjnldsv/read-package-engines-version-actions@06d6baf7d8f41934ab630e97d9e6c0bc9c9ac5e4 # v3
        id: versions
        with:
          fallbackNode: '^24'
          fallbackNpm: '^10'

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        if: ${{ steps.versions.outputs.nodeVersion }}

      - name: Set up node ${{ steps.versions.outputs.nodeVersion }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: ${{ steps.versions.outputs.nodeVersion }}
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}
          cache: 'pnpm'

      - name: Set up php 8.3
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: 8.3
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version in package.json and pnpm-lock.yaml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: pnpm version $VERSION --no-git-tag-version --no-commit-hooks

      - name: Update version in appinfo/info.xml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s|<version>.*</version>|<version>$VERSION</version>|g" appinfo/info.xml

      - name: Update CHANGELOG.md with new version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
          DATE: ${{ github.event.created_at }}
        run: |
          # Add new version entry to CHANGELOG.md
          # Get today's date in YYYY-MM-DD format
          RELEASE_DATE=$(date +'%Y-%m-%d')
          sed -i "s|## \[Unreleased\]|## [Unreleased]\n\n## [$VERSION] - $RELEASE_DATE\n\n### Changed\n\n- Initial release preparation\n\n## [Unreleased]|" CHANGELOG.md

      - name: Commit version updates
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "chore: prepare release v$VERSION" || true

      - name: Install pnpm dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: pnpm install --frozen-lockfile

      - name: Install composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Build JavaScript
        run: pnpm run build

      - name: Build Nextcloud App
        run: |
          git submodule update --init --recursive
          make production-setup
          make appstore

      - name: Package Nextcloud app
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          cd build/artifacts
          if [ -f "cad_viewer.tar.gz" ]; then
            mv cad_viewer.tar.gz "cad_viewer-${TAG_NAME}.tar.gz"
          fi
          if [ -f "cad_viewer.zip" ]; then
            mv cad_viewer.zip "cad_viewer-${TAG_NAME}.zip"
          fi

      - name: Create source archives
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          git archive --format=tar.gz -o build/artifacts/nextcloud-cad-viewer-${TAG_NAME}.tar.gz HEAD
          git archive --format=zip -o build/artifacts/nextcloud-cad-viewer-${TAG_NAME}.zip HEAD

      - name: Push version updates
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "chore: prepare release v$VERSION" || true
          git push origin main || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@9e1d1e8e21e7a3b4e33f4e6b3c5e7c3b4d4a4e4f # v2.0.0
        with:
          files: build/artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
