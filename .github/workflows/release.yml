name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository == 'ashcoft/nextcloud-cad-viewer'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install gh CLI
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: pnpm install --frozen-lockfile

      - name: Check for changesets
        id: check_changesets
        run: |
          echo "Checking for changeset files..."
          CHANGESET_FILES=$(find .changeset -maxdepth 1 -name "*.md" \( ! -name "README.md" -a ! -name "config.json" \) 2>/dev/null | wc -l)
          echo "changeset_count=$CHANGESET_FILES" >> $GITHUB_OUTPUT

          if [ "$CHANGESET_FILES" != "0" ]; then
            echo "Found $CHANGESET_FILES changeset file(s)"
            find .changeset -maxdepth 1 -name "*.md" \( ! -name "README.md" -a ! -name "config.json" \) -exec basename {} \;
          fi

      - name: Version bump
        if: steps.check_changesets.outputs.changeset_count != '0'
        id: version_bump
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          pnpm changeset version || exit 1

          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New version: $NEW_VERSION"

          if [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
            sed -i "s|<version>[0-9.]*</version>|<version>${NEW_VERSION}</version>|g" appinfo/info.xml
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create version bump commit
        if: steps.check_changesets.outputs.changeset_count != '0' && steps.version_bump.outputs.version_changed == 'true'
        run: |
          git add .
          git commit -m "chore: version bump

          Co-authored-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>" || exit 0

      - name: Create tag and release
        if: steps.check_changesets.outputs.changeset_count != '0' && steps.version_bump.outputs.version_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="v${VERSION}"

          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            # Push tag first
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME"

            # Create release archives
            ARCHIVE_DIR=$(mktemp -d)
            
            git archive --format=zip --prefix="cad_viewer-${VERSION}/" -o "${ARCHIVE_DIR}/cad_viewer-v${VERSION}.zip" HEAD
            git archive --format=tar --prefix="cad_viewer-${VERSION}/" HEAD | gzip -9 > "${ARCHIVE_DIR}/cad_viewer-v${VERSION}.tar.gz"

            # Wait for tag to be available
            sleep 3

            # Generate changelog
            CHANGELOG=$(pnpm changeset log --since="v${CURRENT_VERSION}" 2>/dev/null || echo "Changes from changesets")

            # Create GitHub Release with assets
            gh release create "$TAG_NAME" \
              --title "Release $TAG_NAME" \
              --notes "$CHANGELOG" \
              "${ARCHIVE_DIR}/cad_viewer-v${VERSION}.zip" \
              "${ARCHIVE_DIR}/cad_viewer-v${VERSION}.tar.gz"
          fi

      - name: Push changes
        if: steps.check_changesets.outputs.changeset_count != '0' && steps.version_bump.outputs.version_changed == 'true'
        run: |
          git push origin main || exit 0

      - name: Clean up changeset files
        if: steps.check_changesets.outputs.changeset_count != '0' && steps.version_bump.outputs.version_changed == 'true'
        run: |
          find .changeset -maxdepth 1 -name "*.md" \( ! -name "README.md" -a ! -name "config.json" \) -exec rm {} \;
          git add .
          git commit -m "chore: remove processed changeset files

          Co-authored-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>" || exit 0
          git push origin main || exit 0
