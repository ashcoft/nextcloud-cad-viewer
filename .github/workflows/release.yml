name: Release

on:
  push:
    branches:
      - main
      - stable
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no release)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  APP_NAME: cad_viewer

jobs:
  build:
    name: Build Nextcloud App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: |
          pnpm install
          composer install --no-dev --optimize-autoloader

      - name: Build Nextcloud App
        run: |
          pnpm run build
          make production-setup

      - name: Ensure zip available
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y zip
          fi

      - name: Build app archive
        run: |
          make appstore
          echo "=== Built Artifacts ==="
          ls -la build/artifacts/

      - name: Verify artifacts
        id: verify
        run: |
          echo "Checking build artifacts..."
          if [ -f "build/artifacts/${APP_NAME}.tar.gz" ]; then
            echo "::notice::Found ${APP_NAME}.tar.gz"
            echo "size=$(stat -f%z build/artifacts/${APP_NAME}.tar.gz 2>/dev/null || stat -c%s build/artifacts/${APP_NAME}.tar.gz)" >> $GITHUB_OUTPUT
          else
            echo "::error::Missing ${APP_NAME}.tar.gz"
            exit 1
          fi
          if [ -f "build/artifacts/${APP_NAME}.zip" ]; then
            echo "::notice::Found ${APP_NAME}.zip"
            echo "zip_size=$(stat -f%z build/artifacts/${APP_NAME}.zip 2>/dev/null || stat -c%s build/artifacts/${APP_NAME}.zip)" >> $GITHUB_OUTPUT
          else
            echo "::error::Missing ${APP_NAME}.zip"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.APP_NAME }}-build
          path: |
            build/artifacts/*.tar.gz
            build/artifacts/*.zip
          retention-days: 1
          compression-level: 6
          overwrite: true

  release:
    name: Release & Publish
    runs-on: ubuntu-latest
    needs: build
    if: github.repository_owner == 'ashcoft'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.semantic.outputs.version }}
      tag_name: ${{ steps.semantic.outputs.tag_name }}
      release_created: ${{ steps.release_check.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.APP_NAME }}-build
          path: build/artifacts

      - name: Verify artifacts exist
        run: |
          echo "=== Artifacts ==="
          ls -la build/artifacts/
          if [ ! -f "build/artifacts/${APP_NAME}.tar.gz" ]; then
            echo "::error::Missing tar.gz artifact"
            exit 1
          fi
          if [ ! -f "build/artifacts/${APP_NAME}.zip" ]; then
            echo "::error::Missing zip artifact"
            exit 1
          fi

      - name: Check for existing release
        id: release_check
        run: |
          # Get last successful release version from tags
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "Last tag: $LAST_TAG"
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT
          echo "created=false" >> $GITHUB_OUTPUT

      - name: Semantic Release
        id: semantic
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Running semantic-release in dry-run mode..."
            npx semantic-release --dry-run
          else
            echo "Running semantic-release..."
            npx semantic-release
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot}@users.noreply.github.com
          DRY_RUN: ${{ github.event.inputs.dry_run }}

      - name: Check release status
        id: release_status
        run: |
          # Get the latest tag that was just created
          CURRENT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "Current tag: $CURRENT_TAG"
          
          if [ -n "$CURRENT_TAG" ]; then
            echo "::notice::Release tag $CURRENT_TAG was created"
            # Check if this is a new release by comparing with last successful run
            if [ "$CURRENT_TAG" != "${{ steps.release_check.outputs.last_tag }}" ]; then
              echo "release_created=true" >> $GITHUB_OUTPUT
            else
              echo "release_created=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "::warning::No release tag was created"
            echo "release_created=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifacts to release
        if: steps.release_status.outputs.release_created == 'true'
        run: |
          TAG=$(git describe --tags --abbrev=0)
          echo "Uploading release assets for: $TAG"
          
          for FILE in \
            "build/artifacts/${APP_NAME}.tar.gz" \
            "build/artifacts/${APP_NAME}.zip"; do
            if [ -f "$FILE" ]; then
              echo "Uploading: $FILE"
              gh release upload "$TAG" "$FILE" --clobber || {
                echo "::error::Failed to upload $FILE to release $TAG"
                exit 1
              }
              echo "::notice::Successfully uploaded: $FILE"
            else
              echo "::error::File not found: $FILE"
              exit 1
            fi
          done
          
          echo "=== Verifying upload ==="
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name): \(.size) bytes"'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Retry artifact upload if failed
        if: failure() && steps.release_status.outputs.release_created == 'true'
        run: |
          echo "=== Retrying artifact upload ==="
          TAG=$(git describe --tags --abbrev=0)
          echo "Retrying upload for: $TAG"
          
          for FILE in \
            "build/artifacts/${APP_NAME}.tar.gz" \
            "build/artifacts/${APP_NAME}.zip"; do
            if [ -f "$FILE" ]; then
              echo "Retrying: $FILE"
              gh release upload "$TAG" "$FILE" --clobber || echo "::error::Retry failed for $FILE"
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
