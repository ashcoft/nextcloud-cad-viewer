name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for manual release (e.g., 0.0.8)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  APP_NAME: cad_viewer

jobs:
  # Auto-versioning and PR management via Changesets
  changesets:
    name: Changesets
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "^24"
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset tag
          commit: "chore: version bump"
          title: "chore: version bump"
          setupGitUser: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Setup release configuration
  setup:
    name: Setup Release Configuration
    runs-on: ubuntu-latest
    # Run if it's a tag push OR manual dispatch OR a changeset was just published (tagged)
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch') ||
      (needs.changesets.outputs.published == 'true')
    needs: [changesets]
    outputs:
      version: ${{ steps.config.outputs.version }}
      tag_name: ${{ steps.config.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Determine release configuration
        id: config
        env:
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
            TAG_NAME="v${VERSION}"
          elif [[ "$REF" == refs/tags/v* ]]; then
            VERSION="${REF#refs/tags/v}"
            TAG_NAME="${REF#refs/tags/}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG_NAME="v${VERSION}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

  # Build release artifacts using the reusable workflow
  build:
    name: Build Release
    needs: [setup]
    uses: ./.github/workflows/artifact.yml
    with:
      version: ${{ needs.setup.outputs.version }}
      tag_name: ${{ needs.setup.outputs.tag_name }}
      is_release: true

  # Publish the release to GitHub
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [setup, build]
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.setup.outputs.tag_name }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@fa0b9128d581dd491ac9d854c1ac0972ad51130d # v4.1.8
        with:
          name: ${{ env.APP_NAME }}-${{ env.TAG_NAME }}
          path: artifacts/

      - name: List artifacts
        run: ls -R artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          body: |
            ## Release ${{ env.TAG_NAME }}

            Automated release for ${{ env.TAG_NAME }}.
            See CHANGELOG.md for details.
          generate_release_notes: true
          files: |
            artifacts/cad_viewer-${{ env.TAG_NAME }}.tar.gz
            artifacts/cad_viewer-${{ env.TAG_NAME }}.zip
            artifacts/nextcloud-cad-viewer-${{ env.TAG_NAME }}.tar.gz
            artifacts/nextcloud-cad-viewer-${{ env.TAG_NAME }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
