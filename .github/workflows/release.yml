name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository == 'ashcoft/nextcloud-cad-viewer'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for changesets
        id: check_changesets
        run: |
          echo "Checking for changeset files..."
          CHANGESET_FILES=$(find .changeset -maxdepth 1 -name "*.md" \( ! -name "README.md" -a ! -name "config.json" \) 2>/dev/null | wc -l)
          echo "Changeset files found: $CHANGESET_FILES"
          echo "changeset_count=$CHANGESET_FILES" >> $GITHUB_OUTPUT

          if [ "$CHANGESET_FILES" != "0" ]; then
            echo "Found changeset files:"
            find .changeset -maxdepth 1 -name "*.md" \( ! -name "README.md" -a ! -name "config.json" \) -exec basename {} \;
          fi

      - name: Version bump
        if: steps.check_changesets.outputs.changeset_count != '0'
        run: |
          pnpm changeset version || {
            echo "Changeset version failed, checking package.json"
            if grep -q "0.0.8" package.json; then
              echo "Version is 0.0.8, no changeset to process"
              exit 0
            fi
            exit 1
          }
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s|<version>[0-9.]*</version>|<version>${VERSION}</version>|g" appinfo/info.xml

      - name: Create version bump commit
        if: steps.check_changesets.outputs.changeset_count != '0'
        run: |
          git add .
          git commit -m "chore: version bump

          Co-authored-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>" || exit 0

      - name: Create tag and release
        if: steps.check_changesets.outputs.changeset_count != '0'
        env:
          VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="v${VERSION}"

          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME"

            # Create GitHub Release
            CHANGELOG=$(cat <<'EOF' | head -20
## What's Changed
This release includes changes from changesets.
EOF
            )

            curl -s -X POST "https://api.github.com/repos/${{ github.repository }}/releases" \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{
                \"tag_name\": \"$TAG_NAME\",
                \"name\": \"Release $TAG_NAME\",
                \"body\": \"$CHANGELOG\",
                \"draft\": false,
                \"prerelease\": false
              }"
          fi

      - name: Push changes
        if: steps.check_changesets.outputs.changeset_count != '0'
        run: |
          git push origin main || exit 0
