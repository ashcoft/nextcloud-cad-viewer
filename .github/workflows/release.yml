name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  APP_NAME: cad_viewer

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ashcoft'
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      version: ${{ steps.release-please.outputs.version }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Release Please
        id: release-please
        uses: googleapis/release-please-action@f3969c04a4ec81d7a9aa4010d84ae6a7602f86a7 # v4.1.1
        with:
          release-type: node
          package-name: nextcloud-cad-viewer
          monorepo-tags: false
          default-branch: main
          changelog-types: |
            [{"type":"feat","section":"Features","hidden":false},{"type":"fix","section":"Bug Fixes","hidden":false},{"type":"chore","section":"Maintenance","hidden":false},{"type":"docs","section":"Documentation","hidden":false},{"type":"refactor","section":"Refactoring","hidden":false},{"type":"perf","section":"Performance","hidden":false},{"type":"test","section":"Testing","hidden":false},{"type":"ci","section":"CI/CD","hidden":false},{"type":"build","section":"Build System","hidden":false},{"type":"deps","section":"Dependencies","hidden":false},{"type":"security","section":"Security","hidden":true}]

  update-version:
    name: Update Version Files
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Setup Git config
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Get version
        id: version
        run: |
          VERSION=${{ needs.release-please.outputs.version }}
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Update appinfo/info.xml
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo "Updating appinfo/info.xml to version $VERSION"
          sed -i "s|<version>[0-9.]*</version>|<version>${VERSION}</version>|" appinfo/info.xml
          cat appinfo/info.xml | grep -E '<version>|<id>'
          git diff appinfo/info.xml

      - name: Update package.json
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo "Updating package.json to version $VERSION"
          # Use node to safely update package.json
          node -e "
            const pkg = require('./package.json');
            pkg.version = '$VERSION';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          cat package.json | grep '"version"'
          git diff package.json | head -20

      - name: Update .release-please-manifest.json
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo "Updating .release-please-manifest.json to version $VERSION"
          echo "{\"nextcloud-cad-viewer\": \"$VERSION\"}" > .release-please-manifest.json
          cat .release-please-manifest.json
          git diff .release-please-manifest.json

      - name: Commit version updates
        run: |
          TAG=${{ steps.version.outputs.tag }}
          if git diff --quiet; then
            echo "No version changes to commit"
          else
            echo "Committing version updates"
            git add appinfo/info.xml package.json .release-please-manifest.json
            git commit -m "chore(release): update version to $TAG"
            git tag -a $TAG -m "$TAG" || true
            git push origin main
            git push origin $TAG || true
          fi

  build-and-release:
    name: Build & Release App Package
    runs-on: ubuntu-latest
    needs: [release-please, update-version]
    if: needs.release-please.outputs.release_created == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Get PHP version from composer.json
        id: php-version
        run: |
          PHP_VERSION=$(grep -oP '"php": "\K[^"]+' composer.json | head -1)
          echo "version=$PHP_VERSION" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2 # v2.37.2
        with:
          php-version: ${{ steps.php-version.outputs.version }}
          coverage: none

      - name: Get version from release
        id: version
        run: |
          VERSION=${{ needs.update-version.outputs.version }}
          if [ -z "$VERSION" ]; then
            VERSION=${{ needs.release-please.outputs.version }}
          fi
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      - name: Sync version to appinfo/info.xml (fallback)
        run: |
          VERSION=${{ steps.version.outputs.version }}
          CURRENT=$(grep -oP '(?<=<version>)[^<]+' appinfo/info.xml)
          if [ "$CURRENT" != "$VERSION" ]; then
            echo "Syncing appinfo/info.xml from $CURRENT to $VERSION"
            sed -i "s|<version>[0-9.]*</version>|<version>${VERSION}</version>|" appinfo/info.xml
          fi

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: |
          pnpm install --frozen-lockfile
          composer install --no-dev --optimize-autoloader

      - name: Build Nextcloud App
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: |
          pnpm run build
          make production-setup
          make appstore || true

      - name: Install zip (if missing)
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y zip
          fi

      - name: Build app archive (if not built)
        run: |
          if [ ! -f "build/artifacts/${APP_NAME}.tar.gz" ]; then
            make appstore
          fi

      - name: List built artifacts
        run: |
          echo "=== Built Artifacts ==="
          ls -la build/artifacts/ || echo "Artifacts dir not found"
          find build/artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) 2>/dev/null | head -20

      - name: Upload artifacts to release
        run: |
          TAG=${{ needs.release-please.outputs.tag_name }}
          APP_NAME="cad_viewer"

          echo "Uploading artifacts to release: $TAG"
          echo "=== Checking artifacts ==="
          ls -la build/artifacts/ || echo "Artifacts dir not found"

          # Upload tar.gz (required)
          TARBALL="build/artifacts/${APP_NAME}.tar.gz"
          if [ -f "$TARBALL" ]; then
            echo "Uploading $TARBALL"
            gh release upload "$TAG" "$TARBALL" --clobber || {
              echo "ERROR: Failed to upload tar.gz"
              exit 1
            }
          else
            echo "ERROR: $TARBALL not found - build may have failed"
            ls -la build/artifacts/ 2>/dev/null || echo "Directory does not exist"
            exit 1
          fi

          # Upload zip (optional)
          ZIPFILE="build/artifacts/${APP_NAME}.zip"
          if [ -f "$ZIPFILE" ]; then
            echo "Uploading $ZIPFILE"
            gh release upload "$TAG" "$ZIPFILE" --clobber || echo "Warning: failed to upload zip"
          else
            echo "Note: $ZIPFILE not found, skipping"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}
          path: |
            build/artifacts/*.tar.gz
            build/artifacts/*.zip
          retention-days: 90
          compression-level: 6
          overwrite: true
