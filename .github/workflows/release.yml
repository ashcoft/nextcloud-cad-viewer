name: Release

on:
  # Manual trigger (keeps existing functionality)
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.0.11). If not provided, changeset files will be used.'
        required: false
        type: string
  
  # Automatic trigger when changes are pushed to main
  push:
    branches:
      - main
    paths:
      - '.changeset/**'  # Only trigger when changeset files change
      - 'package.json'   # Or when package.json changes (version bumps)
      - 'appinfo/info.xml'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  APP_NAME: cad_viewer
  APP_ID: cad_viewer

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Only run on the main repository (not forks)
    if: github.repository == 'ashcoft/nextcloud-cad-viewer'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: '8.3'
          coverage: none

      - name: Install gh CLI
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: |
          pnpm install --frozen-lockfile
          composer install --no-dev --optimize-autoloader

      - name: Check for changesets and manual version
        id: check_version
        run: |
          MANUAL_VERSION="${{ github.event.inputs.version }}"
          
          # Check for changeset files
          CHANGESET_FILES=$(find .changeset -maxdepth 1 -name "*.md" \( ! -name "README.md" -a ! -name "config.json" \) 2>/dev/null | wc -l)
          echo "changeset_count=$CHANGESET_FILES" >> $GITHUB_OUTPUT

          # Check if this commit already has a version tag (avoid duplicate releases)
          CURRENT_COMMIT=$(git rev-parse HEAD)
          HAS_TAG=$(git tag --contains $CURRENT_COMMIT | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | wc -l)
          
          if [ "$HAS_TAG" -gt 0 ]; then
            echo "This commit already has a release tag, skipping..."
            echo "should_release=false" >> $GITHUB_OUTPUT
          elif [ -n "$MANUAL_VERSION" ]; then
            echo "Using manually provided version: $MANUAL_VERSION"
            echo "manual_version=$MANUAL_VERSION" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
          elif [ "$CHANGESET_FILES" != "0" ]; then
            echo "Using changeset-based versioning"
            echo "manual_version=" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "No version input and no changeset files found"
            echo "manual_version=" >> $GITHUB_OUTPUT
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi
          
          # Output for trigger context
          echo "is_manual=${MANUAL_VERSION:+true}" >> $GITHUB_OUTPUT
          if [ -z "$MANUAL_VERSION" ] && [ "$CHANGESET_FILES" != "0" ]; then
            echo "trigger_source=changesets_auto" >> $GITHUB_OUTPUT
          elif [ -n "$MANUAL_VERSION" ]; then
            echo "trigger_source=manual" >> $GITHUB_OUTPUT
          else
            echo "trigger_source=none" >> $GITHUB_OUTPUT
          fi

      - name: Version bump (changesets)
        if: steps.check_version.outputs.should_release == 'true' && steps.check_version.outputs.manual_version == ''
        id: version_bump_changeset
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          pnpm changeset version || exit 1

          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New version: $NEW_VERSION"

          if [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
            sed -i "s|<version>[0-9.]*</version>|<version>${NEW_VERSION}</version>|g" appinfo/info.xml
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
            echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Version bump (manual)
        if: steps.check_version.outputs.should_release == 'true' && steps.check_version.outputs.manual_version != ''
        id: version_bump_manual
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          NEW_VERSION="${{ github.event.inputs.version }}"
          
          echo "Current version: $CURRENT_VERSION"
          echo "New version: $NEW_VERSION"

          # Update package.json
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$NEW_VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # Update info.xml
          sed -i "s|<version>[0-9.]*</version>|<version>${NEW_VERSION}</version>|g" appinfo/info.xml

          if [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
            echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Get final version
        id: final_version
        run: |
          if [ "${{ steps.check_version.outputs.manual_version }}" != "" ]; then
            VERSION="${{ steps.check_version.outputs.manual_version }}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "Final version: $VERSION"
          echo "final_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create version bump commit
        if: steps.check_version.outputs.should_release == 'true' && (steps.version_bump_changeset.outputs.version_changed == 'true' || steps.version_bump_manual.outputs.version_changed == 'true')
        run: |
          git add .
          git commit -m "chore: version bump

          Co-authored-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>" || exit 0

      - name: Build Nextcloud App Package
        if: steps.check_version.outputs.should_release == 'true' && (steps.version_bump_changeset.outputs.version_changed == 'true' || steps.version_bump_manual.outputs.version_changed == 'true')
        run: |
          echo "Building Nextcloud app package..."
          git submodule update --init --recursive
          make production-setup
          make appstore
          
          echo "Build artifacts:"
          ls -la build/artifacts/

      - name: Create tag and release
        if: steps.check_version.outputs.should_release == 'true' && (steps.version_bump_changeset.outputs.version_changed == 'true' || steps.version_bump_manual.outputs.version_changed == 'true')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.final_version.outputs.final_version }}"
          CURRENT_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          TAG_NAME="v${VERSION}"

          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            # Push tag first
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME"

            # Wait for tag to be available
            sleep 3

            # Generate changelog
            if [ -d ".changeset" ] && [ "$(find .changeset -maxdepth 1 -name '*.md' \( ! -name 'README.md' -a ! -name 'config.json' \) 2>/dev/null | wc -l)" != "0" ]; then
              CHANGELOG=$(pnpm changeset log --since="v${CURRENT_VERSION}" 2>/dev/null || echo "Release $TAG_NAME")
            else
              CHANGELOG="Release $TAG_NAME"
            fi

            # Create GitHub Release with Nextcloud app package assets
            gh release create "$TAG_NAME" \
              --title "Release $TAG_NAME" \
              --notes "$CHANGELOG" \
              "build/artifacts/cad_viewer.tar.gz" \
              "build/artifacts/cad_viewer.zip"
          fi

      - name: Push changes
        if: steps.check_version.outputs.should_release == 'true' && (steps.version_bump_changeset.outputs.version_changed == 'true' || steps.version_bump_manual.outputs.version_changed == 'true')
        run: |
          git push origin main || exit 0

      - name: Clean up changeset files
        if: steps.check_version.outputs.should_release == 'true' && steps.check_version.outputs.changeset_count != '0' && (steps.version_bump_changeset.outputs.version_changed == 'true' || steps.version_bump_manual.outputs.version_changed == 'true')
        run: |
          find .changeset -maxdepth 1 -name "*.md" \( ! -name "README.md" -a ! -name "config.json" \) -exec rm {} \;
          git add .
          git commit -m "chore: remove processed changeset files

          Co-authored-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>" || exit 0
          git push origin main || exit 0
