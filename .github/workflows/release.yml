name: Release

on:
  push:
    branches: [main]
    paths:
      - '.changeset/**'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  APP_NAME: cad_viewer

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ashcoft'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Get PHP version from composer.json
        id: php-version
        run: |
          PHP_VERSION=$(grep -oP '"php": "\K[^"]+' composer.json | head -1)
          echo "version=$PHP_VERSION" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2 # v2.37.2
        with:
          php-version: ${{ steps.php-version.outputs.version }}
          coverage: none

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: |
          pnpm install --frozen-lockfile
          composer install --no-dev --optimize-autoloader

      - name: Get current version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Version bump with Changesets
        id: changeset
        run: |
          pnpm changeset version

      - name: Sync version to info.xml
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s|<version>[0-9.]*</version>|<version>${VERSION}</version>|" appinfo/info.xml

      - name: Install dependencies after version bump
        run: pnpm install --frozen-lockfile

      - name: Build Nextcloud App
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: |
          pnpm run build
          make production-setup
          make appstore

      - name: Create Release on GitHub
        id: create_release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          
          # Get changelog for this release
          CHANGELOG=$(pnpm changeset status --verbose 2>/dev/null | tail -n +4 | head -n -1 || echo "Release v${VERSION}")
          
          # Create release with tag
          gh release create "v${VERSION}" \
            --title "Release v${VERSION}" \
            --notes "$CHANGELOG" \
            --draft false \
            --latest true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APP_NAME="cad_viewer"
          
          # Upload tar.gz
          TARBALL="build/artifacts/${APP_NAME}.tar.gz"
          if [ -f "$TARBALL" ]; then
            gh release upload "v${VERSION}" "$TARBALL" --clobber
          fi
          
          # Upload zip
          ZIPFILE="build/artifacts/${APP_NAME}.zip"
          if [ -f "$ZIPFILE" ]; then
            gh release upload "v${VERSION}" "$ZIPFILE" --clobber
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push version bump
        run: |
          git add -A
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git commit -m "chore: version bump"
            git push
          fi