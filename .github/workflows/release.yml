name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for manual release (e.g., v0.0.2)'
        required: true
        type: string
      prerelease:
        description: 'Create as prerelease'
        required: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4.1.3
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.set-tag.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Determine tag name
        id: set-tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          else
            TAG_NAME="${{ needs.release-please.outputs.tag_name }}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "is_prerelease=${{ github.event.inputs.prerelease || false }}" >> $GITHUB_OUTPUT

      - name: Read package.json node and npm engines version
        uses: skjnldsv/read-package-engines-version-actions@06d6baf7d8f41934ab630e97d9e6c0bc9c9ac5e4 # v3
        id: versions
        continue-on-error: true
        with:
          fallbackNode: '^24'
          fallbackPnpm: '^10'

      - name: Setup pnpm
        if: ${{ steps.versions.outputs.nodeVersion }}
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Set up node ${{ steps.versions.outputs.nodeVersion }}
        if: ${{ steps.versions.outputs.nodeVersion }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}
          cache: 'pnpm'

      - name: Set up php 8.3
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: 8.3
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: pnpm install --frozen-lockfile

      - name: Install composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Build JavaScript
        run: pnpm run build

      - name: Build projects
        run: make production-setup

      - name: Package Nextcloud app with makefile
        run: |
          make appstore
          cd build/artifacts
          for f in *.tar.gz *.zip; do
            if [ -f "$f" ]; then
              if [[ "$f" == *.tar.gz ]]; then
                mv "$f" "cad_viewer-${{ steps.set-tag.outputs.tag_name }}.tar.gz"
              else
                mv "$f" "cad_viewer-${{ steps.set-tag.outputs.tag_name }}.zip"
              fi
            fi
          done

      - name: Verify app artifacts
        run: ls -lah build/artifacts/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cad_viewer-${{ steps.set-tag.outputs.tag_name }}
          path: |
            build/artifacts/cad_viewer-${{ steps.set-tag.outputs.tag_name }}.tar.gz
            build/artifacts/cad_viewer-${{ steps.set-tag.outputs.tag_name }}.zip

  release:
    runs-on: ubuntu-latest
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created || github.event.inputs.tag_name != '' }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: cad_viewer-${{ needs.build.outputs.tag_name }}
          path: build/artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2.2.0
        with:
          tag_name: ${{ needs.build.outputs.tag_name }}
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
          files: |
            build/artifacts/cad_viewer-${{ needs.build.outputs.tag_name }}.tar.gz
            build/artifacts/cad_viewer-${{ needs.build.outputs.tag_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Nextcloud App Store
        if: ${{ !github.event.inputs.prerelease }}
        run: |
          if [[ -n "$NEXTCLOUD_TOKEN" && -n "$NEXTCLOUD_KEY" ]]; then
            sleep 60
            echo "$NEXTCLOUD_KEY" > cad_viewer.key
            export signature=`openssl dgst -sha512 -sign cad_viewer.key build/artifacts/cad_viewer-${{ needs.build.outputs.tag_name }}.tar.gz | openssl base64`
            export requestJSON="{\"download\":\"https://github.com/${{ github.repository }}/releases/download/${{ needs.build.outputs.tag_name }}/cad_viewer-${{ needs.build.outputs.tag_name }}.tar.gz\", \"signature\": \"${signature//$'\n'/\\n}\"}"
            curl -X POST https://apps.nextcloud.com/api/v1/apps/releases -H "Authorization: Token $NEXTCLOUD_TOKEN" -H "Content-Type: application/json" -d "${requestJSON}"
          fi
        env:
          NEXTCLOUD_TOKEN: ${{ secrets.NEXTCLOUD_TOKEN }}
          NEXTCLOUD_KEY: ${{ secrets.NEXTCLOUD_KEY }}
