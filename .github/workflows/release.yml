name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.0.11)'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository == 'ashcoft/nextcloud-cad-viewer'
    outputs:
      has_changesets: ${{ steps.check_changesets.outputs.has_changesets }}
      version_changed: ${{ steps.version_check.outputs.version_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: |
          pnpm install --frozen-lockfile
          composer install --no-dev --optimize-autoloader

      - name: Check for changesets
        id: check_changesets
        run: |
          CHANGESET_COUNT=$(find .changeset -maxdepth 1 -name "*.md" \( ! -name "README.md" -a ! -name "config.json" \) 2>/dev/null | wc -l)
          if [ "$CHANGESET_COUNT" -gt 0 ]; then
            echo "has_changesets=true" >> $GITHUB_OUTPUT
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if version changed
        id: version_check
        run: |
          # Get current version from package.json
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          # Check if there's a tag for this version
          if git rev-parse "v${CURRENT_VERSION}" >/dev/null 2>&1; then
            echo "version_changed=false" >> $GITHUB_OUTPUT
            echo "Current version ${CURRENT_VERSION} is already tagged"
          else
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "Version ${CURRENT_VERSION} has not been released yet"
          fi

      - name: Publish to GitHub Releases (with changesets)
        if: steps.check_changesets.outputs.has_changesets == 'true'
        uses: changesets/action@v1.9.0
        with:
          version: pnpm changeset version
          commit: 'chore: version bump'
          title: 'chore: version bump'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Releases (version bump only)
        if: steps.check_changesets.outputs.has_changesets == 'false' && steps.version_check.outputs.version_changed == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="v${VERSION}"
          
          echo "Creating release for ${TAG_NAME}"
          
          # Create a temporary changelog
          CHANGELOG=$(cat CHANGELOG.md 2>/dev/null | head -50 || echo "Release ${VERSION}")
          
          # Create the release via GitHub API
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d "{
              \"tag_name\": \"${TAG_NAME}\",
              \"name\": \"Release ${TAG_NAME}\",
              \"body\": \"## Release ${VERSION}\\n\\n${CHANGELOG}\",
              \"draft\": false,
              \"prerelease\": false
            }"
          
          # Create the tag
          git tag "${TAG_NAME}"
          git push origin "${TAG_NAME}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No release needed
        if: steps.check_changesets.outputs.has_changesets == 'false' && steps.version_check.outputs.version_changed == 'false'
        run: |
          echo "No changeset files found and version already released. Skipping release."