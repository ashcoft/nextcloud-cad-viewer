name: release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for manual release (e.g., 0.0.2, overrides changeset)'
        required: false
        type: string
      skip_build:
        description: 'Skip build (only tag and release)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  # Step 1: Create version bump PR when changesets exist
  changeset-pr:
    name: Create Version PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "^24"
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          commit: "chore: version bump"
          title: "chore: version bump"
          setupGitUser: true  # Fixed from setupGitHubUser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Step 2: Actually release when merged to main
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      tag_name: ${{ steps.get-version.outputs.tag_name }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Get version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="v${VERSION}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      - name: Check if tag already exists
        id: check-tag
        run: |
          if git rev-parse "${{ steps.get-version.outputs.tag_name }}" 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.get-version.outputs.tag_name }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup pnpm
        if: steps.check-tag.outputs.exists == 'false'
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup node
        if: steps.check-tag.outputs.exists == 'false'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "^24"
          cache: 'pnpm'

      - name: Setup php 8.3
        if: steps.check-tag.outputs.exists == 'false'
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        if: steps.check-tag.outputs.exists == 'false'
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: |
          pnpm install --frozen-lockfile
          composer install --no-dev --optimize-autoloader

      - name: Build JavaScript
        if: steps.check-tag.outputs.exists == 'false'
        run: pnpm run build

      - name: Build projects
        if: steps.check-tag.outputs.exists == 'false'
        run: make production-setup

      - name: Package Nextcloud app
        if: steps.check-tag.outputs.exists == 'false'
        run: |
          make appstore
          cd build/artifacts
          # Handle existing artifacts
          for f in *.tar.gz *.zip; do
            if [ -f "$f" ]; then
              if [[ "$f" == *.tar.gz ]]; then
                mv "$f" "cad_viewer-${{ steps.get-version.outputs.tag_name }}.tar.gz"
              else
                mv "$f" "cad_viewer-${{ steps.get-version.outputs.tag_name }}.zip"
              fi
            fi
          done

      - name: Verify app artifacts
        if: steps.check-tag.outputs.exists == 'false'
        run: ls -lah build/artifacts/

      # Upload app artifacts (2 separate artifacts)
      - name: Upload App TAR.GZ
        if: steps.check-tag.outputs.exists == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: cad_viewer-app-tar-${{ steps.get-version.outputs.tag_name }}
          path: build/artifacts/cad_viewer-${{ steps.get-version.outputs.tag_name }}.tar.gz

      - name: Upload App ZIP
        if: steps.check-tag.outputs.exists == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: cad_viewer-app-zip-${{ steps.get-version.outputs.tag_name }}
          path: build/artifacts/cad_viewer-${{ steps.get-version.outputs.tag_name }}.zip

      # Create source archives
      - name: Create source archives
        if: steps.check-tag.outputs.exists == 'false'
        run: |
          git archive --format=tar.gz -o build/artifacts/nextcloud-cad-viewer-${{ steps.get-version.outputs.tag_name }}.tar.gz HEAD
          git archive --format=zip -o build/artifacts/nextcloud-cad-viewer-${{ steps.get-version.outputs.tag_name }}.zip HEAD

      # Upload source artifacts (2 separate artifacts)
      - name: Upload Source TAR.GZ
        if: steps.check-tag.outputs.exists == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: source-tar-${{ steps.get-version.outputs.tag_name }}
          path: build/artifacts/nextcloud-cad-viewer-${{ steps.get-version.outputs.tag_name }}.tar.gz

      - name: Upload Source ZIP
        if: steps.check-tag.outputs.exists == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: source-zip-${{ steps.get-version.outputs.tag_name }}
          path: build/artifacts/nextcloud-cad-viewer-${{ steps.get-version.outputs.tag_name }}.zip

      # Create and push git tag
      - name: Create and push tag
        if: steps.check-tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.get-version.outputs.tag_name }}" -m "Release ${{ steps.get-version.outputs.tag_name }}"
          git push origin "${{ steps.get-version.outputs.tag_name }}"

  # Step 3: Publish to GitHub Releases
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: create-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download app tar artifact
        uses: actions/download-artifact@v8
        with:
          name: cad_viewer-app-tar-${{ needs.create-release.outputs.tag_name }}
          path: build/artifacts/

      - name: Download app zip artifact
        uses: actions/download-artifact@v8
        with:
          name: cad_viewer-app-zip-${{ needs.create-release.outputs.tag_name }}
          path: build/artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          name: ${{ needs.create-release.outputs.tag_name }}
          generate_release_notes: true
          files: |
            build/artifacts/*.tar.gz
            build/artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Manual release workflow (unchanged, keep as fallback)
  manual-release:
    name: Manual Release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      tag_name: ${{ steps.set-tag.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Determine tag name
        id: set-tag
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            TAG_NAME="v${{ github.event.inputs.version }}"
          else
            TAG_NAME="${GITHUB_REF##*/}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "^24"
          cache: 'pnpm'

      - name: Setup php 8.3
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: |
          pnpm install --frozen-lockfile
          composer install --no-dev --optimize-autoloader

      - name: Update version
        if: ${{ github.event.inputs.version && github.event.inputs.skip_build != 'true' }}
        run: |
          pnpm version ${{ github.event.inputs.version }} --no-git-tag-version
          sed -i 's/<version>.*<\/version>/<version>${{ github.event.inputs.version }}<\/version>/' appinfo/info.xml

      - name: Build
        if: ${{ github.event.inputs.skip_build != 'true' }}
        run: |
          pnpm run build
          make production-setup

      - name: Package Nextcloud app
        if: ${{ github.event.inputs.skip_build != 'true' }}
        run: |
          make appstore
          cd build/artifacts
          for f in *.tar.gz *.zip; do
            if [ -f "$f" ]; then
              if [[ "$f" == *.tar.gz ]]; then
                mv "$f" "cad_viewer-${{ steps.set-tag.outputs.tag_name }}.tar.gz"
              else
                mv "$f" "cad_viewer-${{ steps.set-tag.outputs.tag_name }}.zip"
              fi
            fi
          done

      - name: Verify app artifacts
        if: ${{ github.event.inputs.skip_build != 'true' }}
        run: ls -lah build/artifacts/

      - name: Upload App TAR.GZ
        if: ${{ github.event.inputs.skip_build != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: cad_viewer-app-tar-${{ steps.set-tag.outputs.tag_name }}
          path: build/artifacts/cad_viewer-${{ steps.set-tag.outputs.tag_name }}.tar.gz

      - name: Upload App ZIP
        if: ${{ github.event.inputs.skip_build != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: cad_viewer-app-zip-${{ steps.set-tag.outputs.tag_name }}
          path: build/artifacts/cad_viewer-${{ steps.set-tag.outputs.tag_name }}.zip

      - name: Create source archives
        run: |
          git archive --format=tar.gz -o build/artifacts/nextcloud-cad-viewer-${{ steps.set-tag.outputs.tag_name }}.tar.gz HEAD
          git archive --format=zip -o build/artifacts/nextcloud-cad-viewer-${{ steps.set-tag.outputs.tag_name }}.zip HEAD

      - name: Upload Source TAR.GZ
        uses: actions/upload-artifact@v7
        with:
          name: source-tar-${{ steps.set-tag.outputs.tag_name }}
          path: build/artifacts/nextcloud-cad-viewer-${{ steps.set-tag.outputs.tag_name }}.tar.gz

      - name: Upload Source ZIP
        uses: actions/upload-artifact@v7
        with:
          name: source-zip-${{ steps.set-tag.outputs.tag_name }}
          path: build/artifacts/nextcloud-cad-viewer-${{ steps.set-tag.outputs.tag_name }}.zip

  manual-release-publish:
    name: Publish Manual Release
    runs-on: ubuntu-latest
    needs: manual-release
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: build/artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ needs.manual-release.outputs.tag_name }}
          name: ${{ needs.manual-release.outputs.tag_name }}
          generate_release_notes: true
          files: |
            build/artifacts/**/*.tar.gz
            build/artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
