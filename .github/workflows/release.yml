name: Release (Manual)

on:
  # DISABLED on push - use release-please.yml for automatic releases
  # This workflow is for manual/on-demand releases only to avoid race conditions
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for release (optional, e.g., 1.0.0)'
        required: false
        type: string
      skip_build:
        description: 'Skip build step'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-manual-${{ github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  APP_NAME: cad_viewer

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ashcoft'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Get PHP version from composer.json
        id: php-version
        run: |
          PHP_VERSION=$(grep -oP '"php": "\K[^"]+' composer.json | head -1)
          echo "version=$PHP_VERSION" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10

      - name: Set up node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2 # v2.37.2
        with:
          php-version: ${{ steps.php-version.outputs.version }}
          coverage: none

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: |
          pnpm install
          composer install --no-dev --optimize-autoloader

      - name: Get current version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Update version files if specified
        if: ${{ github.event.inputs.version }}
        run: |
          pnpm version ${{ github.event.inputs.version }} --no-git-tag-version --no-commit-hooks || true
          sed -i "s|<version>[^<]*</version>|<version>${{ github.event.inputs.version }}</version>|" appinfo/info.xml
          pnpm install

      - name: Build Nextcloud App
        if: ${{ !github.event.inputs.skip_build }}
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: |
          pnpm run build
          make production-setup
          make appstore

      - name: Create Release on GitHub
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" \
            --title "Release v${VERSION}" \
            --notes "Release v${VERSION}" \
            --draft false \
            --latest true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP_NAME="cad_viewer"
          
          # Upload tar.gz
          TARBALL="build/artifacts/${APP_NAME}.tar.gz"
          if [ -f "$TARBALL" ]; then
            gh release upload "v${VERSION}" "$TARBALL" --clobber
          else
            echo "Warning: $TARBALL not found"
          fi
          
          # Upload zip
          ZIPFILE="build/artifacts/${APP_NAME}.zip"
          if [ -f "$ZIPFILE" ]; then
            gh release upload "v${VERSION}" "$ZIPFILE" --clobber
          else
            echo "Warning: $ZIPFILE not found"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}