name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.0.11)'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository == 'ashcoft/nextcloud-cad-viewer'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: |
          pnpm install --frozen-lockfile
          composer install --no-dev --optimize-autoloader

      - name: Create version bump PR
        id: changeset
        uses: changesets/action@v1.9.0
        with:
          version: pnpm changeset version
          commit: 'chore: version bump'
          title: 'chore: version bump'
          createGithubReleases: false
          publish: echo "Skipping npm publish"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync version to info.xml
        run: |
          # Get version from package.json
          VERSION=$(node -p "require('./package.json').version")
          
          # Update version in appinfo/info.xml
          sed -i "s/<version>[0-9.]*<\/version>/<version>${VERSION}<\/version>/" appinfo/info.xml
          
          echo "Updated info.xml to version ${VERSION}"
          
          # Commit the change if info.xml was modified
          if git diff --quiet appinfo/info.xml; then
            echo "info.xml already up to date"
          else
            git add appinfo/info.xml
            git commit -m "chore: sync version to info.xml"
            git push origin HEAD:changeset-release/main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Nextcloud App
        run: |
          pnpm build
          make appstore
        env:
          CYPRESS_INSTALL_BINARY: 0

      - name: Check for version bump
        id: version_check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="v${VERSION}"
          
          # Check if this is a version bump commit (merge commit or version bump commit)
          IS_VERSION_BUMP=false
          if git log -1 --format='%s' | grep -q "chore: version bump"; then
            IS_VERSION_BUMP=true
          fi
          
          echo "Current version: ${VERSION}"
          echo "Is version bump: ${IS_VERSION_BUMP}"
          echo "version_bump=${IS_VERSION_BUMP}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release (PR Review)
        if: steps.version_check.outputs.version_bump == 'true'
        run: |
          TAG_NAME="${{ steps.version_check.outputs.tag_name }}"
          VERSION="${{ steps.version_check.outputs.version }}"
          
          echo "Creating release ${TAG_NAME} for review..."
          
          # Generate release notes
          gh release create "$TAG_NAME" \
            --title "Release ${TAG_NAME} (Draft)" \
            --draft \
            --generate-notes \
            --repo "${{ github.repository }}"
          
          # Upload app package
          APP_FILE=$(find build/artifacts -name "*.tar.gz" ! -name "*-source.tar.gz" 2>/dev/null | head -1)
          if [ -n "$APP_FILE" ]; then
            gh release upload "$TAG_NAME" "$APP_FILE" --repo "${{ github.repository }}"
          fi
          
          APP_ZIP=$(find build/artifacts -name "*.zip" ! -name "*-source.zip" 2>/dev/null | head -1)
          if [ -n "$APP_ZIP" ]; then
            gh release upload "$TAG_NAME" "$APP_ZIP" --repo "${{ github.repository }}"
          fi
          
          echo ""
          echo "✅ Draft release created: https://github.com/ashcoft/nextcloud-cad-viewer/releases/tag/${TAG_NAME}"
          echo "📝 Please review and publish the release when ready."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify no release needed
        if: steps.version_check.outputs.version_bump == 'false'
        run: |
          echo "No version bump detected. Skipping release creation."