name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for manual release (optional, e.g., 0.0.10). If not provided, uses changesets.'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # Build job - creates app artifacts
  build:
    name: Build App
    runs-on: ubuntu-latest
    if: github.repository == 'ashcoft/nextcloud-cad-viewer'
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      release_mode: ${{ steps.release_mode.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: pnpm install --frozen-lockfile

      - name: Check for changesets
        id: check_changesets
        run: |
          CHANGESET_FILES=$(find .changeset -maxdepth 1 -name "*.md" \( ! -name "README.md" -a ! -name "config.json" \) 2>/dev/null | wc -l)
          echo "Changeset files found: $CHANGESET_FILES"
          echo "changeset_count=$CHANGESET_FILES" >> $GITHUB_OUTPUT

      - name: Determine release mode
        id: release_mode
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          CHANGESET_COUNT="${{ steps.check_changesets.outputs.changeset_count }}"

          if [[ -n "$INPUT_VERSION" ]]; then
            echo "mode=manual" >> $GITHUB_OUTPUT
            echo "Release mode: manual (version: $INPUT_VERSION)"
          elif [[ "$CHANGESET_COUNT" != "0" ]]; then
            echo "mode=changeset" >> $GITHUB_OUTPUT
            echo "Release mode: changeset"
          else
            echo "mode=none" >> $GITHUB_OUTPUT
            echo "No release mode: no version input and no changesets"
          fi

      - name: Get version
        id: get_version
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          CHANGESET_COUNT="${{ steps.check_changesets.outputs.changeset_count }}"

          if [[ -n "$INPUT_VERSION" ]]; then
            # Manual release: use provided version
            echo "version=$INPUT_VERSION" >> $GITHUB_OUTPUT
            echo "Version: $INPUT_VERSION"
          elif [[ "$CHANGESET_COUNT" != "0" ]]; then
            # Changeset release: run changeset version to get new version
            pnpm changeset version || { echo "Changeset version failed"; exit 1; }
            NEW_VERSION=$(node -p "require('./package.json').version")
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "Version: $NEW_VERSION"
          else
            # No release: use current version
            CURRENT_VERSION=$(node -p "require('./package.json').version")
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "Version: $CURRENT_VERSION"
          fi

      - name: Update version files (manual mode)
        if: github.event.inputs.version != ''
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          pnpm version $VERSION --no-git-tag-version --no-commit-hooks
          sed -i "s|<version>[0-9.]*</version>|<version>${VERSION}</version>|g" appinfo/info.xml
          echo "Updated package.json and info.xml to version $VERSION"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit version changes
        if: steps.release_mode.outputs.mode != 'none'
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git add .
            git commit -m "chore: version bump

            Co-authored-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          fi

      - name: Push version changes
        if: steps.release_mode.outputs.mode != 'none'
        run: |
          if git log --oneline -1 origin/main..HEAD > /dev/null 2>&1; then
            git push origin main
          else
            echo "No commits to push"
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: '8.3'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Build JavaScript
        run: pnpm run build

      - name: Build projects
        run: make production-setup

      - name: Package app
        if: steps.release_mode.outputs.mode != 'none'
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          make appstore
          if [ -f "build/artifacts/cad_viewer.tar.gz" ]; then
            mv build/artifacts/cad_viewer.tar.gz "build/artifacts/cad_viewer-${VERSION}.tar.gz"
          fi
          if [ -f "build/artifacts/cad_viewer.zip" ]; then
            mv build/artifacts/cad_viewer.zip "build/artifacts/cad_viewer-${VERSION}.zip"
          fi
          echo "=== Artifacts ==="
          ls -la build/artifacts/

      - name: Upload artifacts
        if: steps.release_mode.outputs.mode != 'none'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts-${{ github.run_id }}
          path: build/artifacts/
          retention-days: 1

  # Publish release job - downloads artifacts and creates release
  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: github.repository == 'ashcoft/nextcloud-cad-viewer' && needs.build.outputs.release_mode != 'none'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-${{ github.run_id }}
          path: build/artifacts/

      - name: Create release
        env:
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_MODE: ${{ needs.build.outputs.release_mode }}
        run: |
          TAG_NAME="v${VERSION}"

          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME"

            if [[ "$RELEASE_MODE" == "changeset" ]]; then
              CHANGELOG="## What's Changed\nThis release includes changes from changesets."
            else
              CHANGELOG="## What's Changed\nManual release v${VERSION}."
            fi

            UPLOAD_URL=$(curl -s -X POST "https://api.github.com/repos/${{ github.repository }}/releases" \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\": \"$TAG_NAME\", \"name\": \"Release $TAG_NAME\", \"body\": \"$CHANGELOG\", \"draft\": false, \"prerelease\": false}" | jq -r '.upload_url' | sed 's/{?name,label}//')

            echo "Release created at: $UPLOAD_URL"

            if [ -f "build/artifacts/cad_viewer-${VERSION}.tar.gz" ]; then
              curl -s -X POST "${UPLOAD_URL}?name=cad_viewer-${VERSION}.tar.gz" \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Content-Type: application/x-gzip" \
                --data-binary "@build/artifacts/cad_viewer-${VERSION}.tar.gz"
              echo "Attached tar.gz"
            fi

            if [ -f "build/artifacts/cad_viewer-${VERSION}.zip" ]; then
              curl -s -X POST "${UPLOAD_URL}?name=cad_viewer-${VERSION}.zip" \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Content-Type: application/zip" \
                --data-binary "@build/artifacts/cad_viewer-${VERSION}.zip"
              echo "Attached zip"
            fi
          else
            echo "Tag $TAG_NAME already exists, skipping release creation"
          fi

      - name: Clean up changesets (changeset mode)
        if: needs.build.outputs.release_mode == 'changeset'
        run: |
          find .changeset -maxdepth 1 -name "*.md" \( ! -name "README.md" -a ! -name "config.json" \) -exec rm {} \;
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changeset files to remove"
          else
            git add .
            git commit -m "chore: remove processed changeset files

            Co-authored-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            git push origin main
          fi
