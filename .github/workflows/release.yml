name: Release

on:
  push:
    branches:
      - main
    paths:
      - '.changeset/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

  workflow_dispatch:

  repository_dispatch:
    types:
      - release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository == 'ashcoft/nextcloud-cad-viewer'
    outputs:
      has_changesets: ${{ steps.check.outputs.has_changesets }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Check for changeset files
        id: check
        run: |
          if [ -d ".changeset" ] && [ "$(ls -A .changeset/*.md 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "has_changesets=true" >> $GITHUB_OUTPUT
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        if: success() && steps.check.outputs.has_changesets == 'true'

      - name: Set up node >=24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'
        if: success() && steps.check.outputs.has_changesets == 'true'

      - name: Install dependencies
        run: pnpm install
        if: success() && steps.check.outputs.has_changesets == 'true'

      - name: Create changeset PR or release
        uses: changesets/action@v1
        with:
          title: 'ci: version bump'
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
