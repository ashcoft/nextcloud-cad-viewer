name: release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for manual release (e.g., 0.0.8)'
        required: false
        type: string
      skip_build:
        description: 'Skip build (only tag and release)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  # Create version bump PR when changesets exist
  changeset-pr:
    name: Create Version PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "^24"
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          commit: "chore: version bump"
          title: "chore: version bump"
          setupGitUser: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build and create release artifacts (for automatic release on push)
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    outputs:
      tag_name: ${{ steps.get-version.outputs.tag_name }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Get version from tag or package.json
        id: get-version
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAG_NAME="v${VERSION}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG_NAME="v${VERSION}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      - name: Update appinfo/info.xml version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          sed -i "s|<version>.*</version>|<version>${{ steps.get-version.outputs.version }}</version>|" appinfo/info.xml
          cat appinfo/info.xml | grep '<version>'

      - name: Update CHANGELOG.md
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ steps.get-version.outputs.tag_name }}
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          if ! grep -q "^## ${VERSION}" CHANGELOG.md; then
            DATE=$(date +%Y-%m-%d)
            {
              echo ""
              echo "## ${VERSION} (${DATE})"
              echo ""
              echo "### Features"
              echo ""
              echo "- TBD: Add feature notes"
              echo ""
              echo "### Bug Fixes"
              echo ""
              echo "- TBD: Add bug fix notes"
              echo ""
              echo "### Maintenance"
              echo ""
              echo "- TBD: Add maintenance notes"
            } > /tmp/changelog_entry.txt
            sed -i '1r /tmp/changelog_entry.txt' CHANGELOG.md
            echo "Added ${VERSION} entry to CHANGELOG.md"
          else
            echo "Version ${VERSION} already in CHANGELOG.md"
          fi

      - name: Commit version updates
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appinfo/info.xml CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update version files for ${{ steps.get-version.outputs.tag_name }}"
            git push
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "^24"
          cache: 'pnpm'

      - name: Setup php 8.3
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: |
          pnpm install --frozen-lockfile
          composer install --no-dev --optimize-autoloader

      - name: Build JavaScript
        run: pnpm run build

      - name: Build projects
        run: make production-setup

      - name: Package Nextcloud app
        run: |
          make appstore
          cd build/artifacts
          for f in *.tar.gz *.zip; do
            if [ -f "$f" ]; then
              if [[ "$f" == *.tar.gz ]]; then
                mv "$f" "cad_viewer-${{ steps.get-version.outputs.tag_name }}.tar.gz"
              else
                mv "$f" "cad_viewer-${{ steps.get-version.outputs.tag_name }}.zip"
              fi
            fi
          done

      - name: Verify app artifacts
        run: ls -lah build/artifacts/

      - name: Upload App TAR.GZ
        uses: actions/upload-artifact@v4
        with:
          name: cad_viewer-app-tar-${{ steps.get-version.outputs.tag_name }}
          path: build/artifacts/cad_viewer-${{ steps.get-version.outputs.tag_name }}.tar.gz
          retention-days: 90

      - name: Upload App ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cad_viewer-app-zip-${{ steps.get-version.outputs.tag_name }}
          path: build/artifacts/cad_viewer-${{ steps.get-version.outputs.tag_name }}.zip
          retention-days: 90

      - name: Create source archives
        run: |
          git archive --format=tar.gz -o build/artifacts/nextcloud-cad-viewer-${{ steps.get-version.outputs.tag_name }}.tar.gz HEAD
          git archive --format=zip -o build/artifacts/nextcloud-cad-viewer-${{ steps.get-version.outputs.tag_name }}.zip HEAD

      - name: Upload Source TAR.GZ
        uses: actions/upload-artifact@v4
        with:
          name: source-tar-${{ steps.get-version.outputs.tag_name }}
          path: build/artifacts/nextcloud-cad-viewer-${{ steps.get-version.outputs.tag_name }}.tar.gz
          retention-days: 90

      - name: Upload Source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: source-zip-${{ steps.get-version.outputs.tag_name }}
          path: build/artifacts/nextcloud-cad-viewer-${{ steps.get-version.outputs.tag_name }}.zip
          retention-days: 90

      - name: Create and push tag
        run: |
          if git rev-parse "${{ steps.get-version.outputs.tag_name }}" 2>/dev/null; then
            echo "Tag ${{ steps.get-version.outputs.tag_name }} already exists, skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${{ steps.get-version.outputs.tag_name }}" -m "Release ${{ steps.get-version.outputs.tag_name }}"
            git push origin "${{ steps.get-version.outputs.tag_name }}"
          fi

  # Publish to GitHub Releases (for automatic release on push)
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: create-release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: build/artifacts/
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -lah build/artifacts/

      - name: Validate artifacts exist
        run: |
          if ! ls build/artifacts/cad_viewer-${{ needs.create-release.outputs.tag_name }}.tar.gz 1> /dev/null 2>&1; then
            echo "ERROR: App TAR.GZ artifact not found!"
            exit 1
          fi
          if ! ls build/artifacts/cad_viewer-${{ needs.create-release.outputs.tag_name }}.zip 1> /dev/null 2>&1; then
            echo "ERROR: App ZIP artifact not found!"
            exit 1
          fi
          echo "All artifacts validated successfully"

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          name: ${{ needs.create-release.outputs.tag_name }}
          generate_release_notes: true
          files: |
            build/artifacts/*.tar.gz
            build/artifacts/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Manual release workflow
  manual-release:
    name: Manual Release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      tag_name: ${{ steps.set-tag.outputs.tag_name }}
      version: ${{ steps.set-tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Determine tag name
        id: set-tag
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            TAG_NAME="v${{ github.event.inputs.version }}"
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG_NAME="v${VERSION}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "^24"
          cache: 'pnpm'

      - name: Setup php 8.3
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        if: ${{ github.event.inputs.skip_build != 'true' }}
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: |
          pnpm install --frozen-lockfile
          composer install --no-dev --optimize-autoloader

      - name: Update version files
        if: ${{ github.event.inputs.version && github.event.inputs.skip_build != 'true' }}
        run: |
          pnpm version ${{ github.event.inputs.version }} --no-git-tag-version --no-commit-hooks
          sed -i "s/<version>.*<\/version>/<version>${{ github.event.inputs.version }}<\/version>/" appinfo/info.xml

      - name: Build
        if: ${{ github.event.inputs.skip_build != 'true' }}
        run: |
          pnpm run build
          make production-setup

      - name: Package Nextcloud app
        if: ${{ github.event.inputs.skip_build != 'true' }}
        run: |
          make appstore
          cd build/artifacts
          for f in *.tar.gz *.zip; do
            if [ -f "$f" ]; then
              if [[ "$f" == *.tar.gz ]]; then
                mv "$f" "cad_viewer-${{ steps.set-tag.outputs.tag_name }}.tar.gz"
              else
                mv "$f" "cad_viewer-${{ steps.set-tag.outputs.tag_name }}.zip"
              fi
            fi
          done

      - name: Verify app artifacts
        if: ${{ github.event.inputs.skip_build != 'true' }}
        run: ls -lah build/artifacts/

      - name: Upload App TAR.GZ
        if: ${{ github.event.inputs.skip_build != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: cad_viewer-app-tar-${{ steps.set-tag.outputs.tag_name }}
          path: build/artifacts/cad_viewer-${{ steps.set-tag.outputs.tag_name }}.tar.gz
          retention-days: 90

      - name: Upload App ZIP
        if: ${{ github.event.inputs.skip_build != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: cad_viewer-app-zip-${{ steps.set-tag.outputs.tag_name }}
          path: build/artifacts/cad_viewer-${{ steps.set-tag.outputs.tag_name }}.zip
          retention-days: 90

      - name: Create source archives
        run: |
          git archive --format=tar.gz -o build/artifacts/nextcloud-cad-viewer-${{ steps.set-tag.outputs.tag_name }}.tar.gz HEAD
          git archive --format=zip -o build/artifacts/nextcloud-cad-viewer-${{ steps.set-tag.outputs.tag_name }}.zip HEAD

      - name: Upload Source TAR.GZ
        uses: actions/upload-artifact@v4
        with:
          name: source-tar-${{ steps.set-tag.outputs.tag_name }}
          path: build/artifacts/nextcloud-cad-viewer-${{ steps.set-tag.outputs.tag_name }}.tar.gz
          retention-days: 90

      - name: Upload Source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: source-zip-${{ steps.set-tag.outputs.tag_name }}
          path: build/artifacts/nextcloud-cad-viewer-${{ steps.set-tag.outputs.tag_name }}.zip
          retention-days: 90

  # Publish Manual Release
  manual-release-publish:
    name: Publish Manual Release
    runs-on: ubuntu-latest
    needs: manual-release
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: build/artifacts/
          merge-multiple: true

      - name: Validate artifacts exist
        if: ${{ github.event.inputs.skip_build != 'true' }}
        run: |
          if ! ls build/artifacts/cad_viewer-${{ needs.manual-release.outputs.tag_name }}.tar.gz 1> /dev/null 2>&1; then
            echo "ERROR: App TAR.GZ artifact not found!"
            exit 1
          fi
          if ! ls build/artifacts/cad_viewer-${{ needs.manual-release.outputs.tag_name }}.zip 1> /dev/null 2>&1; then
            echo "ERROR: App ZIP artifact not found!"
            exit 1
          fi
          echo "All artifacts validated successfully"

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ needs.manual-release.outputs.tag_name }}
          name: ${{ needs.manual-release.outputs.tag_name }}
          generate_release_notes: true
          files: |
            build/artifacts/*.tar.gz
            build/artifacts/*.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
