# CodeQL Static Analysis
#
# https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning
#
# SPDX-FileCopyrightText: 2024 Nextcloud GmbH and Nextcloud contributors
# SPDX-License-Identifier: MIT

name: CodeQL

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 3 * * 0'

concurrency:
  group: codeql-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.is_template }}

    name: Analyze
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@927dd310a5b11d2eda6f290e5c4d931e1b8f03ab # v3.27.9
        with:
          languages: javascript, typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@927dd310a5b11d2eda6f290e5c4d931e1b8f03ab # v3.27.9

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@927dd310a5b11d2eda6f290e5c4d931e1b8f03ab # v3.27.9
        with:
          category: "/language:javascript"