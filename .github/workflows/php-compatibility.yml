name: PHP Compatibility Tests

on:
  workflow_dispatch:
  push:
    branches: [master, develop]
    paths:
      - 'lib/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml'
      - '.github/workflows/php-compatibility.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - 'lib/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml'
      - '.github/workflows/php-compatibility.yml'

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      php-max: ${{ steps.versions.outputs.php-max }}
      branches-min: ${{ steps.versions.outputs.branches-min }}
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Get version matrix
        id: versions
        uses: icewind1991/nextcloud-version-matrix@v1.3.2

  php-compatibility:
    runs-on: ubuntu-latest
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        database: ['sqlite', 'mysql', 'pgsql']

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: testdb
        options: --health-cmd="mysqladmin ping" --health-interval 5s --health-timeout 2s --health-retries 10

      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        options: --health-cmd="pg_isready" --health-interval 5s --health-timeout 2s --health-retries 10

    steps:
      - name: Detect database host
        id: db
        run: |
          if [ "$GITEA_ACTIONS" = "true" ]; then
            echo "mysql_host=mysql" >> $GITHUB_OUTPUT
            echo "pgsql_host=postgres" >> $GITHUB_OUTPUT
          else
            echo "mysql_host=127.0.0.1" >> $GITHUB_OUTPUT
            echo "pgsql_host=127.0.0.1" >> $GITHUB_OUTPUT
          fi

      - name: Set up Nextcloud env
        uses: ChristophWurst/setup-nextcloud@v0.4.2
        with:
          nextcloud-version: ${{ needs.matrix.outputs.branches-min }}
          php-version: ${{ needs.matrix.outputs.php-max }}
          node-version: false

      - name: Checkout onlyoffice
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
          path: nextcloud/apps/onlyoffice

      - name: Install composer dependencies
        working-directory: nextcloud/apps/onlyoffice
        run: |
          composer install
          composer bin phpunit install

      - name: Start server and configure Nextcloud
        working-directory: nextcloud
        run: |
          mkdir data
          if [ "${{ matrix.database }}" = "mysql" ]; then
            DB_HOST="${{ steps.db.outputs.mysql_host }}"
            DB_TYPE="mysql"
            DB_PASS="rootpassword"
          elif [ "${{ matrix.database }}" = "pgsql" ]; then
            DB_HOST="${{ steps.db.outputs.pgsql_host }}"
            DB_TYPE="pgsql"
            DB_PASS="postgres"
          else
            DB_HOST=""
            DB_TYPE="sqlite"
            DB_PASS=""
          fi

          if [ -z "$DB_HOST" ]; then
            php occ maintenance:install --verbose --database=sqlite --database-name=nextcloud --admin-user admin --admin-pass admin
          else
            php occ maintenance:install --verbose --database=$DB_TYPE --database-name=nextcloud --database-host=$DB_HOST --database-port=3306 --database-user=root --database-pass=$DB_PASS --admin-user admin --admin-pass admin
          fi

          php occ app:enable --force files_external
          php occ app:enable --force onlyoffice

      - name: Run tests
        working-directory: nextcloud/apps/onlyoffice
        run: composer run test:unit
