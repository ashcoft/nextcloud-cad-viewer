name: Release Automation

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        
    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        tools: composer:v2
        
    - name: Install dependencies
      run: |
        npm ci
        composer install --no-interaction
        
    - name: Build app package
      run: |
        npm run build
        mkdir -p build/cad_viewer
        rsync -av --exclude='node_modules' --exclude='.git' --exclude='tests' --exclude='.github' . build/cad_viewer/
        cd build && zip -r cad_viewer-${{ github.ref_name }}.zip cad_viewer/
        
    - name: Generate Changelog
      id: changelog
      uses: requarks/changelog-action@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.ref_name }}
        writeToFile: false
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: build/cad_viewer-${{ github.ref_name }}.zip
        body: ${{ steps.changelog.outputs.changes }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload to Nextcloud App Store
      run: |
        curl -X POST \
          -H "Authorization: Token ${{ secrets.NEXTCLOUD_APP_STORE_TOKEN }}" \
          -F "download=https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/cad_viewer-${{ github.ref_name }}.zip" \
          https://apps.nextcloud.com/api/v1/apps/releases
