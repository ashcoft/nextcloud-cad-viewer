name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  APP_NAME: cad_viewer

jobs:
  release-please:
    name: Create Release PR
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ashcoft'
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      version: ${{ steps.release-please.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Get PHP version from composer.json
        id: php-version
        run: |
          PHP_VERSION=$(grep -oP '"php": "\K[^"]+' composer.json | head -1)
          echo "version=$PHP_VERSION" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2 # v2.37.2
        with:
          php-version: ${{ steps.php-version.outputs.version }}
          coverage: none

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: |
          pnpm install --frozen-lockfile
          composer install --no-dev --optimize-autoloader

      - name: Run Release Please
        id: release-please
        uses: google-github-actions/release-please-action@de0d6bb4d6da84db3d906e3d3cf41698db22c4b1 # v4.1.1
        with:
          release-type: node
          package-name: ${{ env.APP_NAME }}
          version-file: package.json
          extra-files: |
            appinfo/info.xml
          changelog-path: CHANGELOG.md
          default-branch: main
          create-default-mpr: false
          sync-title-from-github: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-release:
    name: Build and Upload Release Assets
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      APP_NAME: cad_viewer
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2 # v2.37.2
        with:
          php-version: 8.4
          coverage: none

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: |
          pnpm install --frozen-lockfile
          composer install --no-dev --optimize-autoloader

      - name: Build Nextcloud App
        run: |
          pnpm run build
          make production-setup
          make appstore

      - name: List built artifacts
        run: |
          echo "=== Built Artifacts ==="
          ls -la build/artifacts/

      - name: Upload tar.gz to Release
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          TARBALL="build/artifacts/${APP_NAME}.tar.gz"
          
          if [ -f "$TARBALL" ]; then
            gh release upload "v${VERSION}" "$TARBALL" --clobber
            echo "Uploaded: $TARBALL"
          else
            echo "Warning: $TARBALL not found"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload zip to Release
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          ZIPFILE="build/artifacts/${APP_NAME}.zip"
          
          if [ -f "$ZIPFILE" ]; then
            gh release upload "v${VERSION}" "$ZIPFILE" --clobber
            echo "Uploaded: $ZIPFILE"
          else
            echo "Warning: $ZIPFILE not found"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync version to info.xml
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          sed -i "s|<version>[0-9.]*</version>|<version>${VERSION}</version>|" appinfo/info.xml
          git add appinfo/info.xml
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -m "chore: sync version to info.xml" || true
          git push || true
