sonar.projectKey=ashcoft_nextcloud-cad-viewer
sonar.organization=ashcoft
sonar.sources=lib,src
sonar.php.exclusions=vendor/**
sonar.javascript.exclusions=node_modules/**,js/**

# Exclude vendored third-party "Sepo" agent infrastructure from analysis.
# .agent/ is a vendored runtime (ships its own package.json/node_modules/tests),
# analogous to vendor/ and node_modules/ which are already excluded above.
# The .github/agent-* workflows, actions, prompts and assets are part of the same
# vendored infrastructure, not the project's own application code (lib/, src/).
sonar.exclusions=.agent/**,.github/actions/**,.github/prompts/**,.github/assets/**,.github/workflows/agent-*.yml,.github/workflows/test-scripts.yml,.github/ISSUE_TEMPLATE/agent-goal.yml,.github/ISSUE_TEMPLATE/ask-sepo.md,.github/ISSUE_TEMPLATE/install-sepo.md
